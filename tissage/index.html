<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrillage tissé</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f3eee8; --light: #ffffff; --dark: #d9d0c5;
    --ink: #212121; --mute: #67625c; --accent: #8f5f42;
    --bar: #f4ff77; --on-bar: #212121;
    --raise: 6px 6px 12px var(--dark), -6px -6px 12px var(--light);
    --raise-sm: 3px 3px 6px var(--dark), -3px -3px 6px var(--light);
    --inset: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--bar); color: var(--on-bar); padding: 8px 16px; min-height: 50px; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #reset { border: none; border-radius: 12px; padding: 8px 14px; font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer; background: rgba(255,255,255,.45); color: var(--on-bar); box-shadow: 3px 3px 6px rgba(0,0,0,.12), -2px -2px 5px rgba(255,255,255,.6); }
  #reset:active { box-shadow: inset 2px 2px 5px rgba(0,0,0,.15), inset -2px -2px 5px rgba(255,255,255,.6); }
  .app { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 50px); }
  aside { padding: 24px 20px; overflow-y: auto; max-height: calc(100vh - 50px); }
  .sub { color: var(--mute); font-size: .85rem; line-height: 1.5; margin: 0 4px 20px; }

  .card { background: var(--bg); border-radius: 24px; padding: 18px 20px; margin: 0 0 22px; box-shadow: 9px 9px 18px var(--dark), -9px -9px 18px var(--light); }
  .card h2 { font-size: .95rem; margin: 0 0 10px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .85rem; margin: 10px 0; color: var(--mute); }
  label > .name { flex: 0 0 82px; }

  input[type=number], select {
    border: none; border-radius: 12px; padding: 7px 10px; background: var(--bg); color: var(--ink);
    box-shadow: var(--inset); font: inherit; font-size: .85rem; outline: none;
  }
  input[type=number] { width: 70px; min-width: 0; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=number]:focus, select:focus { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
  .row { display: flex; gap: 12px; }
  .row label { flex: 1; min-width: 0; }

  /* Curseurs */
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 10px; border-radius: 10px; background: var(--bg); box-shadow: var(--inset); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; border: 2px solid var(--bg); background-image: radial-gradient(circle, var(--accent) 0 3px, transparent 4px); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; border: none; background-image: radial-gradient(circle, var(--accent) 0 3px, transparent 4px); }

  /* Interrupteurs */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 46px; height: 26px; border-radius: 26px; background: var(--bg); box-shadow: var(--inset); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); box-shadow: 2px 2px 4px var(--dark), -2px -2px 4px var(--light); transition: transform .2s, background .2s; }
  input[type=checkbox]:checked::after { transform: translateX(20px); background: var(--accent); }

  /* Couleurs */
  input[type=color] { -webkit-appearance: none; appearance: none; width: 40px; height: 40px; border: none; border-radius: 12px; padding: 5px; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 8px; }
  input[type=color]::-moz-color-swatch { border: none; border-radius: 8px; }
  input[type=color]:disabled { opacity: .4; cursor: default; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .sw { position: relative; }
  .sw button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--bg); color: var(--mute); box-shadow: var(--raise-sm); font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; display: none; }
  .sw:hover button, .sw:focus-within button { display: block; }
  @media (hover: none) { .sw button { display: block; } }
  .add { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--bg); box-shadow: var(--inset); color: var(--mute); font-size: 20px; cursor: pointer; }

  .btn { border: none; border-radius: 16px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--accent); box-shadow: 5px 5px 10px var(--dark), -5px -5px 10px var(--light); flex: 1; }
  .btn:active { box-shadow: var(--inset); }
  .btn.ghost { color: var(--mute); font-weight: 500; }
  .exports { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }

  main { display: flex; flex-direction: column; min-width: 0; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: hidden; min-height: 60vh; }
  .well { padding: 16px; border-radius: 24px; background: var(--bg); box-shadow: 9px 9px 18px var(--dark), -9px -9px 18px var(--light); }
  .frame { position: relative; border-radius: 6px; overflow: hidden;
    background-color: #fff;
    background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  #art { position: absolute; top: 0; left: 0; overflow: hidden; transform-origin: 0 0; }
  #layer { position: absolute; transform-origin: 50% 50%; }
  #layer > div { position: absolute; }
  #tiles { position: absolute; inset: 0; display: none; background-repeat: repeat; background-position: 0 0; }
  .hint { color: var(--mute); font-size: .78rem; line-height: 1.4; margin: 0 0 6px; }
  .hint:empty { display: none; }
  input:disabled { opacity: .45; }
  .info { text-align: center; color: var(--mute); font-size: .8rem; padding-bottom: 16px; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { max-height: none; padding: 20px 16px; }
    main { position: sticky; top: 0; background: var(--bg); z-index: 2; order: -1; }
    .stage { min-height: 42vh; padding: 20px 16px; }
  }
</style>
</head>
<body>
<header><span>Quadrillage tissé</span><button id="reset" title="Revenir aux réglages par défaut">Réinitialiser</button></header>
<div class="app">
  <aside>
    <p class="sub">Bandes horizontales et verticales qui passent dessus / dessous en alternance.</p>

    <section class="card">
      <h2>Toile</h2>
      <label>Raccord infini (taille minimale) <input type="checkbox" id="tile"></label>
      <label>Aperçu en mosaïque <input type="checkbox" id="mosaic"></label>
      <p class="hint" id="tileHint"></p>
      <div class="row">
        <label>Largeur <input type="number" id="W" min="10" max="10000"></label>
        <label>Hauteur <input type="number" id="H" min="10" max="10000"></label>
      </div>
      <label><span class="name">Fond</span> <input type="color" id="bg"></label>
      <label><span class="name">Transparent</span> <input type="checkbox" id="bgT"></label>
      <label><span class="name">Rotation</span> <input type="range" id="rot" min="-90" max="90"><input type="number" id="rotN" min="-90" max="90"></label>
    </section>

    <section class="card">
      <h2>Bandes horizontales</h2>
      <label><span class="name">Épaisseur</span> <input type="range" id="hT" min="1" max="400"><input type="number" id="hTN" min="1"></label>
      <label><span class="name">Espacement</span> <input type="range" id="hG" min="0" max="400"><input type="number" id="hGN" min="0"></label>
      <label><span class="name">Décalage</span> <input type="range" id="hO" min="0" max="400"><input type="number" id="hON" min="0"></label>
      <div class="swatches" id="hC"></div>
    </section>

    <section class="card">
      <h2>Bandes verticales</h2>
      <label><span class="name">Épaisseur</span> <input type="range" id="vT" min="1" max="400"><input type="number" id="vTN" min="1"></label>
      <label><span class="name">Espacement</span> <input type="range" id="vG" min="0" max="400"><input type="number" id="vGN" min="0"></label>
      <label><span class="name">Décalage</span> <input type="range" id="vO" min="0" max="400"><input type="number" id="vON" min="0"></label>
      <div class="swatches" id="vC"></div>
    </section>

    <section class="card">
      <h2>Tissage</h2>
      <label><span class="name">Opacité aux croisements</span> <input type="range" id="op" min="0" max="100"><input type="number" id="opN" min="0" max="100"></label>
      <label>Tissé (dessus / dessous) <input type="checkbox" id="weave"></label>
      <label>Inverser l'alternance <input type="checkbox" id="flip"></label>
    </section>

    <section class="card">
      <h2>Télécharger</h2>
      <label>Résolution <select id="scale"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option></select></label>
      <div class="exports">
        <button class="btn" data-fmt="png">PNG</button>
        <button class="btn" data-fmt="jpeg">JPEG</button>
        <button class="btn" data-fmt="pdf">PDF</button>
        <button class="btn" data-fmt="svg">SVG</button>
      </div>
    </section>

    <section class="card">
      <h2>Impression 3D (3MF)</h2>
      <label>Largeur de l'objet (mm) <input type="number" id="mmW" min="5" max="1000" step="1"></label>
      <label>Épaisseur du fond (mm) <input type="number" id="zBase" min="0" max="20" step="0.05"></label>
      <label>Épaisseur des bandes (mm) <input type="number" id="zBand" min="0.05" max="20" step="0.05"></label>
      <label>Relief du tissage (mm) <input type="number" id="zWeave" min="0" max="20" step="0.05"></label>
      <label>Mélange aux croisements <select id="mix"><option value="layers">Couches superposées</option><option value="dither">Trame de lignes</option></select></label>
      <label id="layerHL">Hauteur de couche (mm) <input type="number" id="layerH" min="0.04" max="1" step="0.02"></label>
      <label id="ditherWL">Largeur de trame (mm) <input type="number" id="ditherW" min="0.1" max="5" step="0.05"></label>
      <p class="hint" id="mixHint"></p>
      <p class="hint" id="mmHint"></p>
      <div class="exports"><button class="btn" data-fmt="3mf">3MF</button></div>
    </section>
  </aside>

  <main>
    <div class="stage" id="stage"><div class="well"><div class="frame" id="frame"><div id="art"><div id="layer"></div></div><div id="tiles"></div></div></div></div>
    <div class="info" id="info"></div>
  </main>
</div>

<script>
const DEFAULTS = {
  W: 1200, H: 1200, bg: '#f4f0e8', bgT: false, rot: 0,
  hT: 90, hG: 150, hO: 60, vT: 90, vG: 150, vO: 60,
  hC: ['#3f9e74', '#f39bc9', '#f4c84e', '#b8a6ea'],
  vC: ['#7f9ce6', '#f4c84e', '#b8a6ea', '#5b7bd5'],
  op: 100, weave: true, flip: false, tile: false, mosaic: false,
  scale: 1, mmW: 100, zBase: 0.4, zBand: 0.4, zWeave: 0.2,
  mix: 'layers', layerH: 0.08, ditherW: 0.4
};
const MM = ['mmW', 'zBase', 'zBand', 'zWeave', 'layerH', 'ditherW'];
let S;
try { S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('tissage') || '{}')); } catch { S = { ...DEFAULTS }; }
S.hC = [...S.hC]; S.vC = [...S.vC];

const $ = id => document.getElementById(id);
const SLIDERS = ['rot','hT','hG','hO','vT','vG','vO','op'];
const SNAP = 2; // distance (en unités) à laquelle le curseur colle aux valeurs rondes

function syncInputs() {
  $('W').value = S.W; $('H').value = S.H;
  SLIDERS.forEach(k => { $(k).value = S[k]; $(k + 'N').value = S[k]; });
  $('bg').value = S.bg; $('bgT').checked = S.bgT; $('weave').checked = S.weave; $('flip').checked = S.flip;
  $('tile').checked = S.tile; $('mosaic').checked = S.mosaic;
  $('scale').value = S.scale; $('mix').value = S.mix;MM.forEach(k => $(k).value = S[k]);
  renderSwatches('hC'); renderSwatches('vC');
}
function renderSwatches(key) {
  const box = $(key); box.innerHTML = '';
  S[key].forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'sw';
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = c;
    inp.oninput = () => { S[key][i] = inp.value; update(); };
    const x = document.createElement('button'); x.textContent = '×'; x.title = 'Retirer';
    x.onclick = () => { if (S[key].length > 1) { S[key].splice(i, 1); renderSwatches(key); update(); } };
    d.append(inp, x); box.append(d);
  });
  const add = document.createElement('button'); add.className = 'add'; add.textContent = '+'; add.title = 'Ajouter une couleur';
  add.onclick = () => { S[key].push(S[key][S[key].length - 1]); renderSwatches(key); update(); };
  box.append(add);
}

/* Modèle : liste de rectangles dans l'ordre de dessin, dans un calque de taille LW×LH.
   Les bandes sont opaques ; seule la bande du dessus, aux croisements, prend l'opacité réglée. */
function strips(len, t, gap, off, colors) {
  const p = t + gap, out = [];
  let start = ((off % p) + p) % p - p, k = 0;
  for (let pos = start; pos < len; pos += p, k++) out.push({ pos, t, color: colors[k % colors.length], i: k });
  return out;
}
function buildModel() {
  const W = +S.W, H = +S.H, rot = +S.rot;
  const D = rot ? Math.ceil(Math.hypot(W, H)) : 0;
  const LW = rot ? D : W, LH = rot ? D : H;
  const hs = strips(LH, +S.hT, +S.hG, +S.hO, S.hC);
  const vs = strips(LW, +S.vT, +S.vG, +S.vO, S.vC);
  const a = S.op / 100, base = [], cross = [];
  // segments horizontaux hors croisements
  for (const h of hs) {
    let x = 0;
    for (const v of vs) {
      if (v.pos > x) base.push({ x, y: h.pos, w: v.pos - x, h: h.t, c: h.color, a: 1 });
      x = Math.max(x, v.pos + v.t);
    }
    if (x < LW) base.push({ x, y: h.pos, w: LW - x, h: h.t, c: h.color, a: 1 });
  }
  // segments verticaux hors croisements
  for (const v of vs) {
    let y = 0;
    for (const h of hs) {
      if (h.pos > y) base.push({ x: v.pos, y, w: v.t, h: h.pos - y, c: v.color, a: 1 });
      y = Math.max(y, h.pos + h.t);
    }
    if (y < LH) base.push({ x: v.pos, y, w: v.t, h: LH - y, c: v.color, a: 1 });
  }
  // croisements : dessous opaque, puis dessus avec l'opacité
  for (const h of hs) for (const v of vs) {
    const r = { x: v.pos, y: h.pos, w: v.t, h: h.t };
    let hTop = S.weave ? (h.i + v.i) % 2 === 0 : false;
    if (S.flip) hTop = !hTop;
    const [under, over] = hTop ? [v.color, h.color] : [h.color, v.color];
    cross.push({ ...r, c: under, a: 1, k: 'under' }, { ...r, c: over, a, k: 'over', u: under, od: hTop ? 'h' : 'v' });
  }
  return { W, H, LW, LH, rot, rects: base.concat(cross) };
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

/* Plus petite tuile qui se raccorde : un nombre entier de périodes, qui boucle à la fois
   la liste des couleurs et l'alternance dessus/dessous (cycle de 2). */
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function tileSize() {
  const cyc = S.weave ? 2 : 1;
  return {
    W: (+S.vT + +S.vG) * lcm(S.vC.length, cyc),
    H: (+S.hT + +S.hG) * lcm(S.hC.length, cyc)
  };
}

/* Aperçu en CSS : chaque rectangle est un div positionné */
function renderPreview(m) {
  const art = $('art'), layer = $('layer'), frame = $('frame'), stage = $('stage'), tiles = $('tiles');
  const availW = stage.clientWidth - 96, availH = stage.clientHeight - 96;
  if (S.mosaic) {
    const n = 3, k = Math.min(1, availW / (m.W * n), availH / (m.H * n));
    art.style.display = 'none'; tiles.style.display = 'block';
    tiles.style.backgroundImage = `url(${renderCanvas(m, Math.min(1, k * (window.devicePixelRatio || 1) * 2)).toDataURL()})`;
    tiles.style.backgroundSize = `${m.W * k}px ${m.H * k}px`;
    frame.style.width = m.W * k * n + 'px'; frame.style.height = m.H * k * n + 'px';
    $('info').textContent = `Tuile ${m.W} × ${m.H} px répétée 3 × 3 — aperçu à ${Math.round(k * 100)} %`;
    return;
  }
  art.style.display = ''; tiles.style.display = 'none';
  art.style.width = m.W + 'px'; art.style.height = m.H + 'px';
  art.style.background = S.bgT ? 'transparent' : S.bg;
  layer.style.width = m.LW + 'px'; layer.style.height = m.LH + 'px';
  layer.style.left = (m.W - m.LW) / 2 + 'px'; layer.style.top = (m.H - m.LH) / 2 + 'px';
  layer.style.transform = `rotate(${m.rot}deg)`;
  layer.innerHTML = m.rects.map(r =>
    `<div style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${rgba(r.c, r.a)}"></div>`).join('');
  const k = Math.min(1, availW / m.W, availH / m.H);
  art.style.transform = `scale(${k})`;
  frame.style.width = m.W * k + 'px'; frame.style.height = m.H * k + 'px';
  $('info').textContent = `${m.W} × ${m.H} px — aperçu à ${Math.round(k * 100)} %`;
}

/* Rendu canvas pour l'export (même modèle) */
function renderCanvas(m, scale, forceBg) {
  const cv = document.createElement('canvas');
  cv.width = m.W * scale; cv.height = m.H * scale;
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  if (!S.bgT || forceBg) { ctx.fillStyle = S.bgT ? '#ffffff' : S.bg; ctx.fillRect(0, 0, m.W, m.H); }
  ctx.translate(m.W / 2, m.H / 2);
  ctx.rotate(m.rot * Math.PI / 180);
  ctx.translate(-m.LW / 2, -m.LH / 2);
  for (const r of m.rects) { ctx.fillStyle = rgba(r.c, r.a); ctx.fillRect(r.x, r.y, r.w, r.h); }
  return cv;
}

/* Rendu SVG vectoriel (même modèle) */
function renderSVG(m) {
  const bg = S.bgT ? '' : `<rect width="${m.W}" height="${m.H}" fill="${S.bg}"/>`;
  const rects = m.rects.map(r =>
    `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${r.c}"${r.a < 1 ? ` fill-opacity="${r.a}"` : ''}/>`).join('\n');
  const tr = m.rot ? ` transform="translate(${m.W / 2} ${m.H / 2}) rotate(${m.rot}) translate(${-m.LW / 2} ${-m.LH / 2})"` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${m.W}" height="${m.H}" viewBox="0 0 ${m.W} ${m.H}" shape-rendering="crispEdges">
<defs><clipPath id="c"><rect width="${m.W}" height="${m.H}"/></clipPath></defs>
${bg}
<g clip-path="url(#c)"><g${tr}>
${rects}
</g></g>
</svg>`;
}

/* Rendu 3MF : un objet en plusieurs pièces (fond + une pièce par couleur),
   pour pouvoir attribuer un filament à chaque pièce dans le trancheur. */
function toCanvasPt(m, x, y) {
  if (!m.rot) return [x, y];
  const t = m.rot * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  const dx = x - m.LW / 2, dy = y - m.LH / 2;
  return [c * dx - s * dy + m.W / 2, s * dx + c * dy + m.H / 2];
}
function clipToCanvas(pts, W, H) {
  const edges = [p => p[0] >= 0, p => p[0] <= W, p => p[1] >= 0, p => p[1] <= H];
  const inter = [
    (a, b) => { const t = (0 - a[0]) / (b[0] - a[0]); return [0, a[1] + t * (b[1] - a[1])]; },
    (a, b) => { const t = (W - a[0]) / (b[0] - a[0]); return [W, a[1] + t * (b[1] - a[1])]; },
    (a, b) => { const t = (0 - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), 0]; },
    (a, b) => { const t = (H - a[1]) / (b[1] - a[1]); return [a[0] + t * (b[0] - a[0]), H]; }
  ];
  for (let e = 0; e < 4 && pts.length; e++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], ina = edges[e](a), inb = edges[e](b);
      if (ina) out.push(a);
      if (ina !== inb) out.push(inter[e](a, b));
    }
    pts = out;
  }
  return pts;
}
function addPrism(mesh, poly, z0, z1) {
  let area = 0;
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; area += a[0] * b[1] - b[0] * a[1]; }
  if (Math.abs(area) < 1e-6 || poly.length < 3) return;
  if (area < 0) poly = poly.slice().reverse();
  const n = poly.length, o = mesh.v.length;
  poly.forEach(p => mesh.v.push([p[0], p[1], z0]));
  poly.forEach(p => mesh.v.push([p[0], p[1], z1]));
  for (let i = 1; i < n - 1; i++) {
    mesh.t.push([o, o + i + 1, o + i]);                 // dessous
    mesh.t.push([o + n, o + n + i, o + n + i + 1]);     // dessus
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    mesh.t.push([o + i, o + j, o + n + j], [o + i, o + n + j, o + n + i]);
  }
}
function build3MF(m) {
  const s = +S.mmW / m.W, zb = Math.max(0, +S.zBase), hb = Math.max(0.01, +S.zBand), hw = Math.max(0, +S.zWeave);
  const toMM = p => [p[0] * s, (m.H - p[1]) * s];
  const parts = new Map(); // nom -> { color, mesh }
  const part = (name, color) => {
    if (!parts.has(name)) parts.set(name, { color, mesh: { v: [], t: [] } });
    return parts.get(name).mesh;
  };
  if (zb > 0) addPrism(part('Fond', S.bg), [[0, 0], [m.W, 0], [m.W, m.H], [0, m.H]].map(toMM), 0, zb);
  const box = (c, x, y, w, h, z0, z1) => {
    if (w <= 0 || h <= 0 || z1 - z0 <= 1e-6) return;
    const corners = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(p => toCanvasPt(m, p[0], p[1]));
    addPrism(part('Bande ' + c, c), clipToCanvas(corners, m.W, m.H).map(toMM), z0, z1);
  };
  const zTop = zb + hb + (S.weave ? hw : 0);
  for (const r of m.rects) {
    if (r.k === 'under') continue; // traité avec la bande du dessus
    if (r.k !== 'over') { box(r.c, r.x, r.y, r.w, r.h, zb, zb + hb); continue; }
    const a = r.a;
    if (a >= 1) { box(r.c, r.x, r.y, r.w, r.h, zb, zTop); continue; }
    if (a <= 0) { box(r.u, r.x, r.y, r.w, r.h, zb, zTop); continue; }
    if (S.mix === 'layers') {
      // Couches : la couleur du dessous, puis une fine épaisseur de la couleur du dessus.
      // La part du dessus suit l'opacité, arrondie à la hauteur de couche.
      const H = zTop - zb, lh = Math.max(0.01, +S.layerH);
      let split = Math.round(H * (1 - a) / lh) * lh;
      split = Math.min(Math.max(split, 0), H);
      box(r.u, r.x, r.y, r.w, r.h, zb, zb + split);
      box(r.c, r.x, r.y, r.w, r.h, zb + split, zTop);
    } else {
      // Trame : lignes alternées des deux couleurs, parallèles à la bande du dessus.
      // La ligne la plus fine fait la largeur de trame ; les proportions suivent l'opacité.
      const wpx = Math.max(0.05, +S.ditherW) / s, P = wpx / Math.min(a, 1 - a), ow = a * P;
      const horiz = r.od === 'h', len = horiz ? r.h : r.w, o0 = horiz ? r.y : r.x;
      for (let d = 0; d < len; d += P) {
        const o1 = Math.min(d + ow, len), u1 = Math.min(d + P, len);
        if (horiz) { box(r.c, r.x, o0 + d, r.w, o1 - d, zb, zTop); box(r.u, r.x, o0 + o1, r.w, u1 - o1, zb, zTop); }
        else { box(r.c, o0 + d, r.y, o1 - d, r.h, zb, zTop); box(r.u, o0 + o1, r.y, u1 - o1, r.h, zb, zTop); }
      }
    }
  }
  const f = x => +x.toFixed(4);
  const list = [...parts.entries()].filter(([, p]) => p.mesh.t.length);
  let id = 2, xml = '';
  const objs = list.map(([name, p]) => {
    const oid = id++;
    const verts = p.mesh.v.map(v => `<vertex x="${f(v[0])}" y="${f(v[1])}" z="${f(v[2])}"/>`).join('');
    const tris = p.mesh.t.map(t => `<triangle v1="${t[0]}" v2="${t[1]}" v3="${t[2]}"/>`).join('');
    xml += `<object id="${oid}" type="model" name="${name}" pid="1" pindex="${oid - 2}"><mesh><vertices>${verts}</vertices><triangles>${tris}</triangles></mesh></object>\n`;
    return oid;
  });
  const mats = list.map(([name, p]) => `<base name="${name}" displaycolor="${p.color.toUpperCase()}FF"/>`).join('');
  const parent = id;
  const model = `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="fr-FR" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
<metadata name="Title">Quadrillage tissé</metadata>
<resources>
<basematerials id="1">${mats}</basematerials>
${xml}<object id="${parent}" type="model" name="Quadrillage tissé"><components>${objs.map(o => `<component objectid="${o}"/>`).join('')}</components></object>
</resources>
<build><item objectid="${parent}"/></build>
</model>`;
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>');
  zip.file('3D/3dmodel.model', model);
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.ms-package.3dmanufacturing-3dmodel+xml' });
}

function download(url, name) {
  const l = document.createElement('a'); l.href = url; l.download = name; document.body.append(l); l.click(); l.remove();
}
function exportAs(fmt) {
  const m = buildModel(), scale = +$('scale').value;
  if (fmt === 'png') {
    renderCanvas(m, scale).toBlob(b => { const u = URL.createObjectURL(b); download(u, 'quadrillage.png'); setTimeout(() => URL.revokeObjectURL(u), 2000); }, 'image/png');
  } else if (fmt === 'jpeg') {
    renderCanvas(m, scale, true).toBlob(b => { const u = URL.createObjectURL(b); download(u, 'quadrillage.jpg'); setTimeout(() => URL.revokeObjectURL(u), 2000); }, 'image/jpeg', 0.95);
  } else if (fmt === '3mf') {
    if (!window.JSZip) { alert('La librairie ZIP n\'a pas pu être chargée.'); return; }
    build3MF(m).then(b => { const u = URL.createObjectURL(b); download(u, 'quadrillage.3mf'); setTimeout(() => URL.revokeObjectURL(u), 2000); });
  } else if (fmt === 'svg') {
    const u = URL.createObjectURL(new Blob([renderSVG(m)], { type: 'image/svg+xml' }));
    download(u, 'quadrillage.svg'); setTimeout(() => URL.revokeObjectURL(u), 2000);
  } else {
    if (!window.jspdf) { alert('La librairie PDF n\'a pas pu être chargée.'); return; }
    const cv = renderCanvas(m, scale);
    const pdf = new jspdf.jsPDF({ orientation: m.W >= m.H ? 'l' : 'p', unit: 'px', format: [m.W, m.H], hotfixes: ['px_scaling'] });
    pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, m.W, m.H);
    pdf.save('quadrillage.pdf');
  }
}

function update() {
  $('bg').disabled = S.bgT;
  if (S.tile) {
    const t = tileSize();
    S.W = t.W; S.H = t.H; S.rot = 0;
    $('W').value = S.W; $('H').value = S.H; $('rot').value = 0; $('rotN').value = 0;
    $('tileHint').textContent = S.W > 10000 || S.H > 10000
      ? 'Attention : la tuile dépasse 10 000 px, réduis le nombre de couleurs ou l\'espacement.'
      : 'La taille suit l\'épaisseur, l\'espacement et le nombre de couleurs. Rotation désactivée pour garder le raccord.';
  } else $('tileHint').textContent = '';
  ['W', 'H', 'rot', 'rotN'].forEach(id => $(id).disabled = S.tile);
  $('layerHL').style.display = S.mix === 'layers' ? '' : 'none';
  $('ditherWL').style.display = S.mix === 'dither' ? '' : 'none';
  $('mixHint').textContent = S.op >= 100
    ? 'Le mélange s\'applique quand l\'opacité aux croisements est sous 100 %.'
    : S.mix === 'layers'
      ? 'La couleur du dessous est imprimée d\'abord, puis une fine couche de la couleur du dessus (plus fine si l\'opacité est basse) : elle laisse transparaître celle du dessous. Règle la même hauteur de couche dans le trancheur.'
      : 'Lignes alternées des deux couleurs, dont les proportions suivent l\'opacité. Mets au moins la largeur de ta buse (0,4 mm en général).';
  const mmH = +S.mmW * S.H / S.W,zTot = +S.zBase + +S.zBand + (S.weave ? +S.zWeave : 0);
  $('mmHint').textContent = `Objet : ${(+S.mmW).toFixed(1)} × ${mmH.toFixed(1)} mm, ${zTot.toFixed(2)} mm d'épaisseur max. `
    + `Une pièce par couleur pour l'impression multicolore${+S.zBase > 0 ? '' : ' (sans fond : les bandes doivent se toucher)'}.`;
  renderPreview(buildModel());
  try { localStorage.setItem('tissage', JSON.stringify(S)); } catch {}
}

['W', 'H'].forEach(k => $(k).addEventListener('input', e => {
  const v = Math.round(+e.target.value);
  if (!v || v < 10 || v > 10000) return;
  S[k] = v; update();
}));

/* Curseurs : aimantés sur 0 et les dizaines pendant le glissement ;
   le champ numérique à côté permet une valeur exacte. */
let dragging = false;
window.addEventListener('pointerup', () => dragging = false);
SLIDERS.forEach(k => {
  const range = $(k), num = $(k + 'N');
  range.addEventListener('pointerdown', () => dragging = true);
  range.addEventListener('input', () => {
    let v = +range.value;
    if (dragging) {
      const r = Math.round(v / 10) * 10;
      if (Math.abs(v - r) <= SNAP) { v = r; range.value = v; }
    }
    S[k] = v; num.value = v; update();
  });
  num.addEventListener('input', () => {
    if (num.value === '' || isNaN(+num.value)) return;
    let v = Math.round(+num.value);
    if (num.min !== '') v = Math.max(+num.min, v);
    if (num.max !== '') v = Math.min(+num.max, v);
    S[k] = v; range.value = v; update();
  });
});

$('bg').oninput = e => { S.bg = e.target.value; update(); };
$('bgT').onchange = e => { S.bgT = e.target.checked; update(); };
$('weave').onchange = e => { S.weave = e.target.checked; update(); };
$('flip').onchange = e => { S.flip = e.target.checked; update(); };
$('scale').onchange = e => { S.scale = +e.target.value; update(); };
$('mix').onchange = e => { S.mix = e.target.value; update(); };
MM.forEach(k => $(k).addEventListener('input', e => {
  const el = e.target, v = +el.value;
  if (el.value === '' || isNaN(v) || v < +el.min || v > +el.max) return;
  S[k] = v; update();
}));
$('tile').onchange =e => { S.tile = e.target.checked; update(); };
$('mosaic').onchange = e => { S.mosaic = e.target.checked; update(); };
document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => exportAs(b.dataset.fmt));
$('reset').onclick = () => { S = { ...DEFAULTS, hC: [...DEFAULTS.hC], vC: [...DEFAULTS.vC] }; syncInputs(); update(); };
window.addEventListener('resize', update);

syncInputs(); update();
</script>
</body>
</html>
