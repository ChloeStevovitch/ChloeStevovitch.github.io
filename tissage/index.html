<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrillage tissé</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #f3eee8; --light: #ffffff; --dark: #d9d0c5;
    --ink: #212121; --mute: #67625c; --accent: #8f5f42;
    --bar: #f4ff77; --on-bar: #212121;
    --raise: 6px 6px 12px var(--dark), -6px -6px 12px var(--light);
    --raise-sm: 3px 3px 6px var(--dark), -3px -3px 6px var(--light);
    --inset: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262422; --light: #312e2b; --dark: #1a1917; --ink: #f0ebe5; --mute: #aaa39b; --accent: #dba884; --bar: #dfe95f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--bar); color: var(--on-bar); padding: 14px 16px; font-weight: 700; font-size: 1.1rem; }
  .app { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 50px); }
  aside { padding: 24px 20px; overflow-y: auto; max-height: calc(100vh - 50px); }
  .sub { color: var(--mute); font-size: .85rem; line-height: 1.5; margin: 0 4px 20px; }

  .card { background: var(--bg); border-radius: 24px; padding: 18px 20px; margin: 0 0 22px; box-shadow: 9px 9px 18px var(--dark), -9px -9px 18px var(--light); }
  .card h2 { font-size: .95rem; margin: 0 0 10px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .85rem; margin: 10px 0; color: var(--mute); }
  label > .name { flex: 0 0 82px; }

  input[type=number], select {
    border: none; border-radius: 12px; padding: 7px 10px; background: var(--bg); color: var(--ink);
    box-shadow: var(--inset); font: inherit; font-size: .85rem; outline: none;
  }
  input[type=number] { width: 70px; min-width: 0; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=number]:focus, select:focus { box-shadow: var(--inset), 0 0 0 2px var(--accent); }
  .row { display: flex; gap: 12px; }
  .row label { flex: 1; min-width: 0; }

  /* Curseurs */
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 10px; border-radius: 10px; background: var(--bg); box-shadow: var(--inset); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; border: 2px solid var(--bg); background-image: radial-gradient(circle, var(--accent) 0 3px, transparent 4px); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; border: none; background-image: radial-gradient(circle, var(--accent) 0 3px, transparent 4px); }

  /* Interrupteurs */
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 46px; height: 26px; border-radius: 26px; background: var(--bg); box-shadow: var(--inset); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .2s; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); box-shadow: 2px 2px 4px var(--dark), -2px -2px 4px var(--light); transition: transform .2s, background .2s; }
  input[type=checkbox]:checked::after { transform: translateX(20px); background: var(--accent); }

  /* Couleurs */
  input[type=color] { -webkit-appearance: none; appearance: none; width: 40px; height: 40px; border: none; border-radius: 12px; padding: 5px; background: var(--bg); box-shadow: var(--raise-sm); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 8px; }
  input[type=color]::-moz-color-swatch { border: none; border-radius: 8px; }
  input[type=color]:disabled { opacity: .4; cursor: default; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
  .sw { position: relative; }
  .sw button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; border: none; background: var(--bg); color: var(--mute); box-shadow: var(--raise-sm); font-size: 12px; line-height: 20px; padding: 0; cursor: pointer; display: none; }
  .sw:hover button, .sw:focus-within button { display: block; }
  @media (hover: none) { .sw button { display: block; } }
  .add { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--bg); box-shadow: var(--inset); color: var(--mute); font-size: 20px; cursor: pointer; }

  .btn { border: none; border-radius: 16px; padding: 12px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--accent); box-shadow: 5px 5px 10px var(--dark), -5px -5px 10px var(--light); flex: 1; }
  .btn:active { box-shadow: var(--inset); }
  .btn.ghost { color: var(--mute); font-weight: 500; }
  .exports { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }

  main { display: flex; flex-direction: column; min-width: 0; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: hidden; min-height: 60vh; }
  .well { padding: 16px; border-radius: 24px; background: var(--bg); box-shadow: 9px 9px 18px var(--dark), -9px -9px 18px var(--light); }
  .frame { position: relative; border-radius: 6px; overflow: hidden;
    background-color: #fff;
    background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
  #art { position: absolute; top: 0; left: 0; overflow: hidden; transform-origin: 0 0; }
  #layer { position: absolute; transform-origin: 50% 50%; }
  #layer > div { position: absolute; }
  .info { text-align: center; color: var(--mute); font-size: .8rem; padding-bottom: 16px; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; }
    aside { max-height: none; padding: 20px 16px; }
    main { position: sticky; top: 0; background: var(--bg); z-index: 2; order: -1; }
    .stage { min-height: 42vh; padding: 20px 16px; }
  }
</style>
</head>
<body>
<header>Quadrillage tissé</header>
<div class="app">
  <aside>
    <p class="sub">Bandes horizontales et verticales qui passent dessus / dessous en alternance.</p>

    <section class="card">
      <h2>Toile</h2>
      <div class="row">
        <label>Largeur <input type="number" id="W" min="10" max="10000"></label>
        <label>Hauteur <input type="number" id="H" min="10" max="10000"></label>
      </div>
      <label><span class="name">Fond</span> <input type="color" id="bg"></label>
      <label><span class="name">Transparent</span> <input type="checkbox" id="bgT"></label>
      <label><span class="name">Rotation</span> <input type="range" id="rot" min="-90" max="90"><input type="number" id="rotN" min="-90" max="90"></label>
    </section>

    <section class="card">
      <h2>Bandes horizontales</h2>
      <label><span class="name">Épaisseur</span> <input type="range" id="hT" min="1" max="400"><input type="number" id="hTN" min="1"></label>
      <label><span class="name">Espacement</span> <input type="range" id="hG" min="0" max="400"><input type="number" id="hGN" min="0"></label>
      <label><span class="name">Décalage</span> <input type="range" id="hO" min="0" max="400"><input type="number" id="hON" min="0"></label>
      <div class="swatches" id="hC"></div>
    </section>

    <section class="card">
      <h2>Bandes verticales</h2>
      <label><span class="name">Épaisseur</span> <input type="range" id="vT" min="1" max="400"><input type="number" id="vTN" min="1"></label>
      <label><span class="name">Espacement</span> <input type="range" id="vG" min="0" max="400"><input type="number" id="vGN" min="0"></label>
      <label><span class="name">Décalage</span> <input type="range" id="vO" min="0" max="400"><input type="number" id="vON" min="0"></label>
      <div class="swatches" id="vC"></div>
    </section>

    <section class="card">
      <h2>Tissage</h2>
      <label><span class="name">Opacité aux croisements</span> <input type="range" id="op" min="0" max="100"><input type="number" id="opN" min="0" max="100"></label>
      <label>Tissé (dessus / dessous) <input type="checkbox" id="weave"></label>
      <label>Inverser l'alternance <input type="checkbox" id="flip"></label>
    </section>

    <section class="card">
      <h2>Télécharger</h2>
      <label>Résolution <select id="scale"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option></select></label>
      <div class="exports">
        <button class="btn" data-fmt="png">PNG</button>
        <button class="btn" data-fmt="jpeg">JPEG</button>
        <button class="btn" data-fmt="pdf">PDF</button>
      </div>
      <div class="exports"><button class="btn ghost" id="reset">Réinitialiser</button></div>
    </section>
  </aside>

  <main>
    <div class="stage" id="stage"><div class="well"><div class="frame" id="frame"><div id="art"><div id="layer"></div></div></div></div></div>
    <div class="info" id="info"></div>
  </main>
</div>

<script>
const DEFAULTS = {
  W: 1200, H: 1200, bg: '#f4f0e8', bgT: false, rot: 0,
  hT: 90, hG: 150, hO: 60, vT: 90, vG: 150, vO: 60,
  hC: ['#3f9e74', '#f39bc9', '#f4c84e', '#b8a6ea'],
  vC: ['#7f9ce6', '#f4c84e', '#b8a6ea', '#5b7bd5'],
  op: 100, weave: true, flip: false
};
let S;
try { S = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem('tissage') || '{}')); } catch { S = { ...DEFAULTS }; }
S.hC = [...S.hC]; S.vC = [...S.vC];

const $ = id => document.getElementById(id);
const SLIDERS = ['rot','hT','hG','hO','vT','vG','vO','op'];
const SNAP = 2; // distance (en unités) à laquelle le curseur colle aux valeurs rondes

function syncInputs() {
  $('W').value = S.W; $('H').value = S.H;
  SLIDERS.forEach(k => { $(k).value = S[k]; $(k + 'N').value = S[k]; });
  $('bg').value = S.bg; $('bgT').checked = S.bgT; $('weave').checked = S.weave; $('flip').checked = S.flip;
  renderSwatches('hC'); renderSwatches('vC');
}
function renderSwatches(key) {
  const box = $(key); box.innerHTML = '';
  S[key].forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'sw';
    const inp = document.createElement('input'); inp.type = 'color'; inp.value = c;
    inp.oninput = () => { S[key][i] = inp.value; update(); };
    const x = document.createElement('button'); x.textContent = '×'; x.title = 'Retirer';
    x.onclick = () => { if (S[key].length > 1) { S[key].splice(i, 1); renderSwatches(key); update(); } };
    d.append(inp, x); box.append(d);
  });
  const add = document.createElement('button'); add.className = 'add'; add.textContent = '+'; add.title = 'Ajouter une couleur';
  add.onclick = () => { S[key].push(S[key][S[key].length - 1]); renderSwatches(key); update(); };
  box.append(add);
}

/* Modèle : liste de rectangles dans l'ordre de dessin, dans un calque de taille LW×LH.
   Les bandes sont opaques ; seule la bande du dessus, aux croisements, prend l'opacité réglée. */
function strips(len, t, gap, off, colors) {
  const p = t + gap, out = [];
  let start = ((off % p) + p) % p - p, k = 0;
  for (let pos = start; pos < len; pos += p, k++) out.push({ pos, t, color: colors[k % colors.length], i: k });
  return out;
}
function buildModel() {
  const W = +S.W, H = +S.H, rot = +S.rot;
  const D = rot ? Math.ceil(Math.hypot(W, H)) : 0;
  const LW = rot ? D : W, LH = rot ? D : H;
  const hs = strips(LH, +S.hT, +S.hG, +S.hO, S.hC);
  const vs = strips(LW, +S.vT, +S.vG, +S.vO, S.vC);
  const a = S.op / 100, base = [], cross = [];
  // segments horizontaux hors croisements
  for (const h of hs) {
    let x = 0;
    for (const v of vs) {
      if (v.pos > x) base.push({ x, y: h.pos, w: v.pos - x, h: h.t, c: h.color, a: 1 });
      x = Math.max(x, v.pos + v.t);
    }
    if (x < LW) base.push({ x, y: h.pos, w: LW - x, h: h.t, c: h.color, a: 1 });
  }
  // segments verticaux hors croisements
  for (const v of vs) {
    let y = 0;
    for (const h of hs) {
      if (h.pos > y) base.push({ x: v.pos, y, w: v.t, h: h.pos - y, c: v.color, a: 1 });
      y = Math.max(y, h.pos + h.t);
    }
    if (y < LH) base.push({ x: v.pos, y, w: v.t, h: LH - y, c: v.color, a: 1 });
  }
  // croisements : dessous opaque, puis dessus avec l'opacité
  for (const h of hs) for (const v of vs) {
    const r = { x: v.pos, y: h.pos, w: v.t, h: h.t };
    let hTop = S.weave ? (h.i + v.i) % 2 === 0 : false;
    if (S.flip) hTop = !hTop;
    const [under, over] = hTop ? [v.color, h.color] : [h.color, v.color];
    cross.push({ ...r, c: under, a: 1 }, { ...r, c: over, a });
  }
  return { W, H, LW, LH, rot, rects: base.concat(cross) };
}

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

/* Aperçu en CSS : chaque rectangle est un div positionné */
function renderPreview(m) {
  const art = $('art'), layer = $('layer'), frame = $('frame'), stage = $('stage');
  art.style.width = m.W + 'px'; art.style.height = m.H + 'px';
  art.style.background = S.bgT ? 'transparent' : S.bg;
  layer.style.width = m.LW + 'px'; layer.style.height = m.LH + 'px';
  layer.style.left = (m.W - m.LW) / 2 + 'px'; layer.style.top = (m.H - m.LH) / 2 + 'px';
  layer.style.transform = `rotate(${m.rot}deg)`;
  layer.innerHTML = m.rects.map(r =>
    `<div style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${rgba(r.c, r.a)}"></div>`).join('');
  const availW = stage.clientWidth - 96, availH = stage.clientHeight - 96;
  const k = Math.min(1, availW / m.W, availH / m.H);
  art.style.transform = `scale(${k})`;
  frame.style.width = m.W * k + 'px'; frame.style.height = m.H * k + 'px';
  $('info').textContent = `${m.W} × ${m.H} px — aperçu à ${Math.round(k * 100)} %`;
}

/* Rendu canvas pour l'export (même modèle) */
function renderCanvas(m, scale, forceBg) {
  const cv = document.createElement('canvas');
  cv.width = m.W * scale; cv.height = m.H * scale;
  const ctx = cv.getContext('2d');
  ctx.scale(scale, scale);
  if (!S.bgT || forceBg) { ctx.fillStyle = S.bgT ? '#ffffff' : S.bg; ctx.fillRect(0, 0, m.W, m.H); }
  ctx.translate(m.W / 2, m.H / 2);
  ctx.rotate(m.rot * Math.PI / 180);
  ctx.translate(-m.LW / 2, -m.LH / 2);
  for (const r of m.rects) { ctx.fillStyle = rgba(r.c, r.a); ctx.fillRect(r.x, r.y, r.w, r.h); }
  return cv;
}

function download(url, name) {
  const l = document.createElement('a'); l.href = url; l.download = name; document.body.append(l); l.click(); l.remove();
}
function exportAs(fmt) {
  const m = buildModel(), scale = +$('scale').value;
  if (fmt === 'png') {
    renderCanvas(m, scale).toBlob(b => { const u = URL.createObjectURL(b); download(u, 'quadrillage.png'); setTimeout(() => URL.revokeObjectURL(u), 2000); }, 'image/png');
  } else if (fmt === 'jpeg') {
    renderCanvas(m, scale, true).toBlob(b => { const u = URL.createObjectURL(b); download(u, 'quadrillage.jpg'); setTimeout(() => URL.revokeObjectURL(u), 2000); }, 'image/jpeg', 0.95);
  } else {
    if (!window.jspdf) { alert('La librairie PDF n\'a pas pu être chargée.'); return; }
    const cv = renderCanvas(m, scale);
    const pdf = new jspdf.jsPDF({ orientation: m.W >= m.H ? 'l' : 'p', unit: 'px', format: [m.W, m.H], hotfixes: ['px_scaling'] });
    pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, m.W, m.H);
    pdf.save('quadrillage.pdf');
  }
}

function update() {
  $('bg').disabled = S.bgT;
  renderPreview(buildModel());
  try { localStorage.setItem('tissage', JSON.stringify(S)); } catch {}
}

['W', 'H'].forEach(k => $(k).addEventListener('input', e => {
  const v = Math.round(+e.target.value);
  if (!v || v < 10 || v > 10000) return;
  S[k] = v; update();
}));

/* Curseurs : aimantés sur 0 et les dizaines pendant le glissement ;
   le champ numérique à côté permet une valeur exacte. */
let dragging = false;
window.addEventListener('pointerup', () => dragging = false);
SLIDERS.forEach(k => {
  const range = $(k), num = $(k + 'N');
  range.addEventListener('pointerdown', () => dragging = true);
  range.addEventListener('input', () => {
    let v = +range.value;
    if (dragging) {
      const r = Math.round(v / 10) * 10;
      if (Math.abs(v - r) <= SNAP) { v = r; range.value = v; }
    }
    S[k] = v; num.value = v; update();
  });
  num.addEventListener('input', () => {
    if (num.value === '' || isNaN(+num.value)) return;
    let v = Math.round(+num.value);
    if (num.min !== '') v = Math.max(+num.min, v);
    if (num.max !== '') v = Math.min(+num.max, v);
    S[k] = v; range.value = v; update();
  });
});

$('bg').oninput = e => { S.bg = e.target.value; update(); };
$('bgT').onchange = e => { S.bgT = e.target.checked; update(); };
$('weave').onchange = e => { S.weave = e.target.checked; update(); };
$('flip').onchange = e => { S.flip = e.target.checked; update(); };
document.querySelectorAll('[data-fmt]').forEach(b => b.onclick = () => exportAs(b.dataset.fmt));
$('reset').onclick = () => { S = { ...DEFAULTS, hC: [...DEFAULTS.hC], vC: [...DEFAULTS.vC] }; syncInputs(); update(); };
window.addEventListener('resize', update);

syncInputs(); update();
</script>
</body>
</html>
