<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Import Tandoor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- ============================================================
     THÈME — tout le design se change ici (couleurs, ombres neumorphiques)
     ============================================================ -->
<style>
  :root {
    --neu-bg: #f3eee8;        /* fond de la page ET des éléments (indispensable au neumorphisme) */
    --neu-light: #ffffff;     /* ombre claire (haut-gauche) */
    --neu-dark: #d9d0c5;      /* ombre sombre (bas-droite) */
    --neu-ink: #212121;       /* texte */
    --neu-mute: #67625c;      /* texte secondaire */
    --neu-accent: #8f5f42;    /* accent (liens, icônes, texte des boutons) : brun de Tandoor */
    --neu-accent-dark: #6f4630;
    --neu-grad: #f4ff77;      /* boutons principaux, étapes faites : jaune de Tandoor (peut être un linear-gradient(...)) */
    --neu-on-accent: #212121; /* texte sur fond jaune */
    --neu-bar: #f4ff77;       /* barre du haut */
    --neu-on-bar: #212121;
    --neu-ok: #2f7d4f;
    --neu-err: #c0392b;
    --neu-out:    10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light);
    --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
    --neu-in:     inset 6px 6px 14px var(--neu-dark), inset -6px -6px 14px var(--neu-light);
    --neu-in-sm:  inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --neu-bg: #262422;
      --neu-light: #312e2b;
      --neu-dark: #1a1917;
      --neu-ink: #f0ebe5;
      --neu-mute: #aaa39b;
      --neu-accent: #dba884;
      --neu-accent-dark: #efc7a6;
      --neu-grad: #e2ec66;
      --neu-on-accent: #212121;
      --neu-bar: #dfe95f;
      --neu-on-bar: #212121;
    }
  }
  :root[data-theme="dark"] {
      --neu-bg: #262422;
      --neu-light: #312e2b;
      --neu-dark: #1a1917;
      --neu-ink: #f0ebe5;
      --neu-mute: #aaa39b;
      --neu-accent: #dba884;
      --neu-accent-dark: #efc7a6;
      --neu-grad: #e2ec66;
      --neu-on-accent: #212121;
      --neu-bar: #dfe95f;
      --neu-on-bar: #212121;
    }
</style>

<style type="text/tailwindcss">
  @theme {
    --color-base: var(--neu-bg);
    --color-ink: var(--neu-ink);
    --color-mute: var(--neu-mute);
    --color-accent: var(--neu-accent);
    --color-ok: var(--neu-ok);
    --color-err: var(--neu-err);
    --color-bar: var(--neu-bar);
    --color-on-bar: var(--neu-on-bar);
    --font-sans: "Quicksand", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Composants réutilisables (modifie ici pour changer le style partout) ---------- */
  @layer components {
    .card      { @apply mb-6 rounded-3xl bg-base p-5; box-shadow: var(--neu-out); }
    .card[data-state=locked] { @apply opacity-60; }
    .inset     { @apply rounded-2xl; box-shadow: var(--neu-in); }

    .btn       { @apply mt-3 w-full cursor-pointer select-none rounded-2xl bg-base px-4 py-3 text-sm font-semibold text-accent transition; box-shadow: var(--neu-out-sm); }
    .btn:hover:not(:disabled):not(.is-off)  { color: var(--neu-accent-dark); }
    .btn:active:not(:disabled):not(.is-off) { box-shadow: var(--neu-in-sm); }
    .btn:disabled, .btn.is-off { @apply cursor-not-allowed opacity-40; box-shadow: none; }
    .btn[data-busy="1"] { @apply animate-pulse opacity-70; box-shadow: var(--neu-in-sm); }
    .btn-primary { background: var(--neu-grad); color: var(--neu-on-accent); }
    .btn-primary:hover:not(:disabled):not(.is-off) { background: var(--neu-accent-dark); color: var(--neu-on-accent); }

    .field     { @apply w-full rounded-xl bg-base px-3 py-2.5 text-sm text-ink outline-none placeholder:text-mute/70; box-shadow: var(--neu-in-sm); }
    .field:focus { box-shadow: var(--neu-in-sm), 0 0 0 2px var(--neu-accent); }
    textarea.field { @apply min-h-56 font-mono text-xs; }
    .lbl       { @apply mb-1 mt-3 block text-xs font-medium text-mute; }
    .muted     { @apply text-xs leading-relaxed text-mute; }
    .log       { @apply mt-3 whitespace-pre-wrap break-words text-xs; }
    .check     { @apply mt-3 flex items-center gap-2 text-sm text-ink; }
    .check input { @apply size-4 accent-[var(--neu-accent)]; }

    /* gros bouton "choisir un fichier" bien visible */
    .drop      { @apply flex cursor-pointer flex-col items-center justify-center gap-1 rounded-2xl bg-base px-4 py-6 text-center text-sm font-semibold text-accent transition; box-shadow: var(--neu-out-sm); }
    .drop small { @apply text-xs font-normal text-mute; }
    .drop:hover, .drop.over { box-shadow: var(--neu-in-sm); }
    input:focus-visible + .drop { outline: 2px solid var(--neu-accent); outline-offset: 2px; }

    /* étapes */
    .step-dot  { @apply inline-flex size-8 shrink-0 items-center justify-center rounded-full bg-base text-sm font-bold text-mute; box-shadow: var(--neu-out-sm); }
    .step-dot[data-state=done]    { background: var(--neu-grad); color: var(--neu-on-accent); }
    .step-dot[data-state=current] { color: var(--neu-accent); box-shadow: var(--neu-in-sm), 0 0 0 2px var(--neu-accent); }
    .step[data-state=current] .step-label { @apply font-semibold text-ink; }
    .status-dot { @apply inline-block size-2.5 rounded-full bg-mute/60; }
    .status-dot.on { background: var(--neu-ok); }

    /* miniatures */
    .thumb     { @apply relative; }
    .thumb img { @apply block aspect-square w-full rounded-xl object-cover; box-shadow: var(--neu-out-sm); }
    .thumb .n  { @apply absolute left-1.5 top-1.5 rounded-full bg-black/65 px-1.5 text-[11px] text-white; }
    .thumb .x, .thumb .c { @apply absolute m-0 flex size-6 cursor-pointer items-center justify-center rounded-full border-0 bg-black/65 p-0 text-xs text-white; }
    .thumb .x  { @apply right-1.5 top-1.5; }
    .thumb .c  { @apply bottom-1.5 right-1.5; }

    /* aperçu */
    .preview   { @apply flex flex-col overflow-hidden p-0; }
    .pv-scroll { @apply flex-1 overflow-auto p-5; }
    .pv-bar    { @apply p-5 pt-1; }
    .pv-title  { @apply mb-1 mt-4 text-xl font-bold; }
    .pv-step h3 { @apply mb-1.5 mt-5 text-sm font-semibold text-accent; }
    .pv-step ul { @apply mb-2 list-disc pl-5 text-sm; }
    .pv-step p { @apply m-0 whitespace-pre-wrap text-sm leading-relaxed; }
    .chip      { @apply mr-1 mt-1 inline-block rounded-full bg-base px-3 py-0.5 text-xs; box-shadow: var(--neu-out-sm); }
    .pv-empty  { @apply rounded-2xl p-8 text-center text-sm text-mute; box-shadow: var(--neu-in); }

    /* tableau nutrition */
    .nt        { @apply mt-2 w-full border-collapse text-xs; }
    .nt th, .nt td { @apply border-b border-mute/20 px-1.5 py-1 text-right; }
    .nt th:first-child, .nt td:first-child { @apply text-left; }
    .nt tr.tot td { @apply font-bold; }
    .nt tr.vegan td:first-child { @apply font-semibold text-accent; }

    .icon-btn  { @apply flex size-10 shrink-0 cursor-pointer items-center justify-center rounded-full bg-base text-accent transition; box-shadow: var(--neu-out-sm); }
    .icon-btn:active { box-shadow: var(--neu-in-sm); }
    .bar .icon-btn { background: transparent; color: inherit; box-shadow: none; }
    .bar .icon-btn:hover { background: rgb(0 0 0 / .08); }
    .chip button { @apply ml-1.5 cursor-pointer text-mute; }
    .listrow   { @apply flex w-full cursor-pointer items-center justify-between gap-3 rounded-xl bg-base px-3 py-2 text-left text-sm; box-shadow: var(--neu-out-sm); }
    .listrow:active { box-shadow: var(--neu-in-sm); }
    .hist-row  { @apply flex flex-col gap-3 rounded-2xl px-4 py-3 sm:flex-row sm:items-center sm:justify-between; box-shadow: var(--neu-in-sm); }

    /* recadrage */
    .ratios button.on { background: var(--neu-grad); color: var(--neu-on-accent); }
  }

  /* poignées de recadrage (hors composants : sélecteurs d'attributs) */
  #cropRect { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none; }
  #cropRect i { position: absolute; width: 26px; height: 26px; background: #fff; border: 2px solid var(--neu-accent); border-radius: 50%; touch-action: none; }
  #cropRect i[data-h=nw] { left: -13px; top: -13px; cursor: nwse-resize; }
  #cropRect i[data-h=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
  #cropRect i[data-h=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; }
  #cropRect i[data-h=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }
  .crop-stage img { display: block; max-width: min(85vw, 700px); max-height: 55vh; }
  [hidden] { display: none !important; }

  /* ---------- Mobile : une étape par écran ---------- */
  @media (max-width: 1023px) {
    .mob-off { display: none !important; }
    .field, textarea.field { font-size: 16px; }   /* évite le zoom automatique d'iOS */
  }
</style>
</head>

<body class="bg-base font-sans text-ink antialiased">
<header class="bar bg-bar text-on-bar">
  <div class="mx-auto flex max-w-[1240px] items-center justify-between gap-3 px-4 py-3" style="padding-top: max(0.75rem, env(safe-area-inset-top, 0px))">
    <h1 class="text-lg font-bold tracking-tight">Import Tandoor</h1>
    <button type="button" id="themeBtn" class="icon-btn" onclick="toggleTheme()" aria-label="Changer de thème" title="Thème clair / sombre">
      <svg id="iconSun" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
    </button>
  </div>
</header>
<div class="mx-auto max-w-[1240px] px-4 pb-32 pt-5 lg:pb-16">


  <ol id="stepper" class="sticky top-0 z-30 -mx-4 mb-3 grid grid-cols-5 gap-2 bg-base px-4 py-2 lg:static lg:mx-0 lg:px-0">
    <li class="step flex cursor-pointer flex-col items-center gap-1.5 text-center sm:gap-3 text-xs text-mute sm:flex-row sm:text-left" data-step="1" onclick="goStep(1)"><span class="step-dot" data-badge="1">1</span><span class="step-label">Connexion</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1.5 text-center sm:gap-3 text-xs text-mute sm:flex-row sm:text-left" data-step="2" onclick="goStep(2)"><span class="step-dot" data-badge="2">2</span><span class="step-label">Source</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1.5 text-center sm:gap-3 text-xs text-mute sm:flex-row sm:text-left" data-step="3" onclick="goStep(3)"><span class="step-dot" data-badge="3">3</span><span class="step-label">Ajuster</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1.5 text-center sm:gap-3 text-xs text-mute sm:flex-row sm:text-left" data-step="4" onclick="goStep(4)"><span class="step-dot" data-badge="4">4</span><span class="step-label">Image</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1.5 text-center sm:gap-3 text-xs text-mute sm:flex-row sm:text-left" data-step="5" onclick="goStep(5)"><span class="step-dot" data-badge="5">5</span><span class="step-label">Envoi</span></li>
  </ol>
  <p id="nextHint" class="inset mb-6 px-4 py-2.5 text-sm"></p>

  <div class="grid grid-cols-1 gap-x-6 lg:grid-cols-2 lg:items-start">

    <!-- ============ Gauche : les étapes ============ -->
    <div>

      <!-- 1 · Connexion -->
      <section class="card" data-card="1">
        <button type="button" id="authToggle" class="flex w-full cursor-pointer items-center gap-3 text-left" aria-expanded="true" onclick="toggleAuth()">
          <span class="step-dot" data-badge="1">1</span>
          <span class="flex items-center gap-2 font-semibold">Connexion <span id="statusDot" class="status-dot"></span></span>
          <span id="authSummary" class="ml-auto min-w-0 truncate text-xs text-mute"></span>
          <svg id="authChevron" class="size-4 shrink-0 text-mute transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="authBody" class="mt-4">
        <label class="lbl" for="tandoorUrl">Adresse Tandoor</label>
        <input class="field" type="text" id="tandoorUrl" placeholder="https://cook.cabanologues.com" oninput="updateUI()">
        <label class="lbl" for="tandoorToken">Token Tandoor</label>
        <input class="field" type="password" id="tandoorToken" placeholder="tda_…" oninput="updateUI()">
        <label class="lbl" for="anthropicKey">Clé API Claude</label>
        <input class="field" type="password" id="anthropicKey" placeholder="sk-ant-…">
        <label class="lbl" for="claudeModel">Modèle</label>
        <input class="field" type="text" id="claudeModel" placeholder="claude-sonnet-5">
        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-primary" onclick="saveAuth()">Enregistrer</button>
          <button class="btn" onclick="testConnection()">Tester</button>
        </div>
        <p class="muted mt-3 whitespace-pre-line" id="authInfo"></p>
        </div>
      </section>

      <!-- 2 · Source -->
      <section class="card" data-card="2">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="2">2</span>
          <h2 class="font-semibold">Source</h2>
        </header>

        <input id="photoFiles" class="sr-only" type="file" accept="image/*" multiple onchange="addPhotos(this)">
        <label for="photoFiles" class="drop" id="dropZone">
          <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Ajouter des photos</span>
          <small>ou les glisser ici</small>
        </label>
        <div class="mt-3 grid grid-cols-[repeat(auto-fill,minmax(84px,1fr))] gap-3" id="thumbs"></div>

        <label class="lbl" for="postText">Texte d'un post (Instagram, Facebook…)</label>
        <textarea class="field !min-h-28" id="postText" oninput="updateUI()" placeholder="Description et commentaires du reel"></textarea>
        <label class="lbl" for="postUrl">Lien (post, vidéo, site) — Claude va lire la page</label>
        <input class="field" type="text" id="postUrl" inputmode="url" placeholder="https://…" oninput="updateUI()">

        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-primary" onclick="analyzePhotos()" id="analyzeBtn">Analyser</button>
          <button class="btn" onclick="clearPhotos()" id="clearBtn">Effacer</button>
        </div>
        <p class="muted mt-2 text-err" id="analyzeWhy"></p>
        <div class="log" id="photoLog"></div>

        <details class="mt-4">
          <summary class="cursor-pointer text-xs font-medium text-accent">Modifier une recette existante</summary>
          <div class="mt-3 flex gap-3">
            <input class="field" type="text" id="editQuery" placeholder="Rechercher (vide : les dernières)" onkeydown="if(event.key==='Enter') searchRecipes()">
            <button class="btn mt-0 w-auto px-4" onclick="searchRecipes()">Chercher</button>
          </div>
          <div id="editList" class="mt-3 grid grid-cols-[minmax(0,1fr)] gap-2"></div>
          <div class="log" id="editLog"></div>
        </details>

        <details class="mt-4">
          <summary class="cursor-pointer text-xs font-medium text-accent">Modifier le JSON</summary>
          <textarea class="field mt-3" id="recipeJson" oninput="renderPreview()" onblur="renderPreview()" spellcheck="false" placeholder="{ … }"></textarea>
          <button class="btn" onclick="loadExample()">Charger un exemple</button>
        </details>
        <button class="btn lg:hidden" onclick="goStep(5)">Voir l'aperçu</button>
      </section>

      <!-- 3 · Ajuster -->
      <section class="card" data-card="3">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="3">3</span>
          <h2 class="font-semibold">Ajuster <span class="text-xs font-normal text-mute">facultatif</span></h2>
        </header>

        <label class="lbl" for="modText">Modification</label>
        <input class="field" type="text" id="modText" placeholder="Ex. remplacer le poulet par du tofu" oninput="updateUI()" onkeydown="if(event.key==='Enter') modifyRecipe()">
        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-primary" onclick="modifyRecipe()" id="modBtn">Appliquer</button>
          <button class="btn" onclick="undoModify()" id="undoBtn">Annuler</button>
        </div>
        <p class="muted mt-2 text-err" id="modWhy"></p>
        <div class="log" id="modLog"></div>

        <h3 class="mb-2 mt-6 text-sm font-semibold">Mots-clés</h3>
        <div id="kwList" class="flex flex-wrap gap-1"></div>
        <div class="mt-3 flex gap-3">
          <input class="field" type="text" id="kwInput" placeholder="Ajouter un mot-clé" onkeydown="if(event.key==='Enter'){event.preventDefault();addKeyword()}">
          <button class="btn mt-0 w-auto px-4" onclick="addKeyword()" id="kwBtn">Ajouter</button>
        </div>

        <h3 class="mb-1 mt-6 text-sm font-semibold">Nutrition <span class="text-xs font-normal text-mute">estimation</span></h3>
        <div id="nutriBox"></div>
        <label class="check"><input type="checkbox" id="nutriSave" checked> Inclure à l'envoi</label>
        <button class="btn" onclick="calcNutrition()" id="nutriBtn">Recalculer</button>
        <p class="muted mt-2 text-err" id="nutriWhy"></p>
        <div class="log" id="nutriLog"></div>
        <button class="btn lg:hidden" onclick="goStep(5)">Voir l'aperçu</button>
      </section>

      <!-- 4 · Image -->
      <section class="card" data-card="4">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="4">4</span>
          <h2 class="font-semibold">Image</h2>
        </header>

        <div class="lg:hidden">
          <img id="pvImg2" class="mb-2 block max-h-64 w-full rounded-2xl object-cover" style="box-shadow: var(--neu-out-sm)" alt="" hidden>
          <p class="muted mb-3" id="candLabel2"></p>
        </div>

        <input id="imageFile" class="sr-only" type="file" accept="image/*" onchange="pickOwnImage(this)">
        <label for="imageFile" class="drop">
          <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
          <span>Choisir une image</span>
        </label>

        <label class="lbl" for="imgQuery">Chercher sur Internet, ou coller un lien d'image</label>
        <div class="flex gap-3">
          <input class="field" type="text" id="imgQuery" placeholder="Mots-clés (vide : nom de la recette) ou https://…" oninput="updateUI()" onkeydown="if(event.key==='Enter') searchImages()">
          <button class="btn mt-0 w-auto px-4" onclick="searchImages()" id="imgSearchBtn">Chercher</button>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <button class="btn" onclick="nextOrSearch()" id="nextImgBtn">Autre</button>
          <button class="btn" onclick="cropCurrent()" id="cropBtn">Recadrer</button>
          <button class="btn" onclick="restoreOriginal()" id="origBtn">Original</button>
        </div>
        <div class="log" id="imageLog"></div>

      </section>
    </div>

    <!-- ============ Droite : aperçu et envoi ============ -->
    <div class="lg:self-stretch">
      <section class="card preview lg:sticky lg:top-4 lg:max-h-[calc(100vh-2rem)]" data-card="5">
        <div class="pv-scroll">
          <header class="mb-4 flex items-center gap-3">
            <span class="step-dot" data-badge="5">5</span>
            <h2 class="font-semibold">Aperçu</h2>
          </header>
          <img id="pvImg" class="block max-h-80 w-full rounded-2xl object-cover" style="box-shadow: var(--neu-out-sm)" alt="" hidden>
          <div class="pv-empty" id="pvNoImg">Pas d'image</div>
          <p class="muted mt-2" id="candLabel"></p>
          <div id="pvBody"></div>
        </div>
        <div class="pv-bar">
          <div class="muted" id="pvChecklist"></div>
          <button class="btn btn-primary" onclick="importRecipe()" id="sendBtn">Envoyer à Tandoor</button>

<script>
const $ = id => document.getElementById(id);

// fetch avec délai maximal (un serveur injoignable ne doit pas bloquer la page)
async function fetchT(url, opts = {}, ms = 20000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    // credentials: 'omit' : pas de cookie de session Tandoor, sinon Django exige un jeton CSRF au lieu du token API
    return await fetch(url, { credentials: 'omit', ...opts, signal: ctl.signal });
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('délai dépassé (' + Math.round(ms / 1000) + ' s)');
    throw e;
  } finally {
    clearTimeout(t);
  }
}

// ---------- Thème clair / sombre ----------
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function syncThemeIcon() {
  // en sombre on propose le soleil (passer au clair), en clair la lune
  $('iconSun').style.display = isDark() ? '' : 'none';
  $('iconMoon').style.display = isDark() ? 'none' : '';
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncThemeIcon();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeIcon);

function log(el, msg, cls) {
  const d = document.getElementById(el);
  const line = document.createElement('div');
  if (cls === 'ok') line.className = 'text-ok';
  else if (cls === 'err') line.className = 'text-err';
  line.textContent = msg;
  d.prepend(line);
}

// ---------- État de l'interface : étapes, boutons verrouillés ----------
const busy = { analyze: false, mod: false, nutri: false, send: false };

// ---------- Mobile : une étape (= un écran) à la fois ----------
let mobStep = 1, lastCur = 1;
const STEP_NAMES = ['Connexion', 'Source', 'Ajuster', 'Image', 'Envoi'];
const isDesktop = () => matchMedia('(min-width: 1024px)').matches;

function goStep(n) {
  mobStep = Math.max(1, Math.min(5, n));
  document.querySelectorAll('[data-card]').forEach(c => c.classList.toggle('mob-off', Number(c.dataset.card) !== mobStep));
  $('mobLabel').textContent = 'Étape ' + mobStep + '/5 · ' + STEP_NAMES[mobStep - 1];
  $('mobPrev').disabled = mobStep === 1;
  $('mobNext').disabled = mobStep === 5;
  if (isDesktop()) document.querySelector('[data-card="' + mobStep + '"]').scrollIntoView({ behavior: 'smooth', block: 'start' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
  updateUI();
}
window.addEventListener('resize', () => { if (isDesktop()) document.querySelectorAll('.mob-off').forEach(c => c.classList.remove('mob-off')); else goStep(mobStep); });

function uiState() {
  const { url, token } = getAuth();
  const json = $('recipeJson').value;
  let p = null;
  try { p = JSON.parse(json); } catch (e) {}
  return {
    connected: !!(url && token),
    key: !!localStorage.getItem('anthropic_key'),
    hasRecipe: !!(p && p.name && Array.isArray(p.steps) && p.steps.length),
    hasImage: !!current,
    hasPhotos: photos.length > 0,
    hasText: !!$('postText').value.trim(),
    hasUrl: /^https?:\/\/\S+/i.test($('postUrl').value.trim()),
    hasMod: !!$('modText').value.trim(),
    fresh: !!(nutri && nutriFor === json),
    sentThis: !!(sent && sent.done && sent.json === json)
  };
}

// Un bouton verrouillé reste cliquable : c'est le clic qui affiche la raison (jamais avant).
const shown = {};
function gate(id, ok, why, whyId, isBusy) {
  const b = $(id);
  const off = !ok && !isBusy;
  b.disabled = !!isBusy;
  b.dataset.busy = isBusy ? '1' : '';
  b.classList.toggle('is-off', off);
  b.dataset.off = off ? '1' : '';
  b.dataset.why = why || '';
  b.dataset.whyId = whyId || '';
  b.title = off ? (why || '') : '';
  if (whyId) {
    if (!off) delete shown[whyId];
    $(whyId).textContent = off && shown[whyId] ? why : '';
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button[data-off="1"]');
  if (!b) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if (b.dataset.whyId) { shown[b.dataset.whyId] = true; $(b.dataset.whyId).textContent = b.dataset.why; }
}, true);

function updateUI() {
  const s = uiState();
  const noKey = 'Clé Claude manquante (étape 1).';
  const noRecipe = 'Pas encore de recette.';
  const hasSource = s.hasPhotos || s.hasText || s.hasUrl;

  gate('analyzeBtn', s.key && hasSource, !s.key ? noKey : 'Ajoute une photo, un texte ou un lien.', 'analyzeWhy', busy.analyze);
  $('clearBtn').disabled = !(s.hasPhotos || s.hasText || $('postUrl').value.trim());

  gate('modBtn', s.key && s.hasRecipe && s.hasMod, !s.hasRecipe ? noRecipe : !s.key ? noKey : 'Décris la modification.', 'modWhy', busy.mod);
  $('undoBtn').disabled = !undoStack.length;

  gate('nutriBtn', s.key && s.hasRecipe, !s.hasRecipe ? noRecipe : noKey, 'nutriWhy', busy.nutri);
  $('kwBtn').disabled = !s.hasRecipe;
  $('kwInput').disabled = !s.hasRecipe;

  $('nextImgBtn').disabled = !(queue.length || s.hasRecipe);
  $('imgSearchBtn').disabled = !(s.hasRecipe || $('imgQuery').value.trim());
  $('cropBtn').disabled = !s.hasImage;
  $('origBtn').disabled = !s.hasImage;

  gate('sendBtn', s.connected && s.hasRecipe, !s.connected ? 'Connexion manquante (étape 1).' : noRecipe, 'sendWhy', busy.send);
  $('sendBtn').textContent = busy.send ? 'Envoi en cours…' : editing ? 'Mettre à jour dans Tandoor' : 'Envoyer à Tandoor';
  $('analyzeBtn').textContent = busy.analyze ? 'Analyse…' : 'Analyser';
  $('modBtn').textContent = busy.mod ? 'Application…' : 'Appliquer';
  $('nutriBtn').textContent = busy.nutri ? 'Calcul…' : 'Recalculer';

  // progression : 1 connexion, 2 recette, 3 ajuster (facultatif), 4 image, 5 envoi
  const done = { 1: s.connected, 2: s.hasRecipe, 3: s.fresh || undoStack.length > 0, 4: s.hasImage, 5: s.sentThis };
  const cur = [1, 2, 4, 5].find(n => !done[n]) || 5;
  lastCur = cur;
  document.querySelectorAll('[data-badge]').forEach(b => {
    const n = Number(b.dataset.badge);
    const state = done[n] ? 'done' : n === cur ? 'current' : 'todo';
    b.dataset.state = state;
    b.textContent = state === 'done' ? '✓' : n;
  });
  document.querySelectorAll('#stepper .step').forEach(li => {
    const n = Number(li.dataset.step);
    li.dataset.state = done[n] ? 'done' : n === cur ? 'current' : 'todo';
  });
  document.querySelector('[data-card="3"]').dataset.state = s.hasRecipe ? '' : 'locked';

  let hint;
  if (s.sentThis) hint = 'Recette envoyée (ID ' + sent.id + ').';
  else if (!s.connected) hint = 'Commence par enregistrer ta connexion.';
  else if (!s.hasRecipe) hint = hasSource ? 'Lance l\'analyse.' : 'Ajoute des photos, un texte ou un lien.';
  else if (!s.hasImage) hint = 'Choisis une image, ou envoie sans.';
  else hint = 'Prêt : vérifie l\'aperçu, puis envoie.';
  $('nextHint').textContent = hint;
  $('nextHint').hidden = !(isDesktop() || mobStep === cur || s.sentThis);

  draftDirty();
}

function getAuth() {
  let url = (localStorage.getItem('tandoor_url') || '').replace(/\/$/, '');
  // page servie derrière le même serveur que l'API (proxy du NAS) : même origine, donc pas de CORS
  if (!url && /^https?:$/.test(location.protocol) && !location.hostname.endsWith('github.io')) url = location.origin;
  return { url, token: localStorage.getItem('tandoor_token') || '' };
}

function refreshStatus() {
  const { url, token } = getAuth();
  const dot = document.getElementById('statusDot');
  const info = document.getElementById('authInfo');
  document.getElementById('tandoorUrl').value = url;
  document.getElementById('tandoorToken').value = token;
  document.getElementById('anthropicKey').value = localStorage.getItem('anthropic_key') || '';
  document.getElementById('claudeModel').value = localStorage.getItem('claude_model') || '';
  if (url && token) {
    dot.classList.add('on');
    info.textContent = 'Connecté à ' + url + (localStorage.getItem('anthropic_key') ? '' : ' (sans clé Claude)');
  } else {
    dot.classList.remove('on');
    info.textContent = 'Non connecté';
  }
  $('authSummary').textContent = (url && token) ? url.replace(/^https?:\/\//, '') : 'Non connecté';
  updateUI();
}

function saveAuth() {
  const url = document.getElementById('tandoorUrl').value.trim();
  const token = document.getElementById('tandoorToken').value.trim();
  if (!url || !token) { alert('URL et token requis.'); return; }
  localStorage.setItem('tandoor_url', url);
  localStorage.setItem('tandoor_token', token);
  localStorage.setItem('anthropic_key', document.getElementById('anthropicKey').value.trim());
  localStorage.setItem('claude_model', document.getElementById('claudeModel').value.trim());
  refreshStatus();
  loadRecent();
  if (uiState().connected) setAuthOpen(false);
  if (mobStep === 1 && uiState().connected) goStep(2);
}

// ---------- Photos → recette (API Claude) ----------
const DEFAULT_MODEL = 'claude-sonnet-5';
let photos = [];      // { name, blob, b64 }
let current = null;   // image candidate: { blob, label }
let queue = [];       // remaining candidates
let currentUrl = null;

function resizeToJpeg(file, maxSide = 2000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('conversion impossible')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('image illisible (' + file.name + ')')); };
    img.src = src;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

async function addPhotos(input) {
  for (const f of input.files) {
    try {
      const blob = await resizeToJpeg(f);
      photos.push({ name: f.name, blob, b64: await blobToBase64(blob) });
    } catch (e) {
      log('photoLog', '' + e.message, 'err');
    }
  }
  input.value = '';
  renderThumbs();
}

function renderThumbs() {
  const box = document.getElementById('thumbs');
  box.textContent = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(p.blob);
    const n = document.createElement('span');
    n.className = 'n'; n.textContent = i + 1;
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { photos.splice(i, 1); renderThumbs(); };
    const c = document.createElement('button');
    c.className = 'c'; c.textContent = '✂'; c.title = 'Recadrer';
    c.onclick = () => openCrop(p.blob, async nb => { p.blob = nb; p.b64 = await blobToBase64(nb); renderThumbs(); });
    d.append(img, n, x, c);
    box.append(d);
  });
  updateUI();
}

function clearPhotos() {
  photos = [];
  $('postText').value = '';
  $('postUrl').value = '';
  renderThumbs();
}

// glisser-déposer de photos sur la zone de dépôt
const dz = $('dropZone');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => addPhotos({ files: [...e.dataTransfer.files].filter(f => f.type.startsWith('image/')), value: '' }));

const RECIPE_TOOL = {
  name: 'submit_recipe',
  description: 'Renvoie la recette extraite des photos, en français.',
  input_schema: {
    type: 'object',
    required: ['name', 'steps', 'image_search_query', 'image_prompt'],
    properties: {
      name: { type: 'string' },
      description: { type: 'string', description: 'Une phrase de présentation.' },
      servings: { type: 'number' },
      servings_text: { type: 'string', description: 'ex. « portions », « personnes ».' },
      working_time: { type: 'integer', description: 'minutes' },
      waiting_time: { type: 'integer', description: 'minutes' },
      steps: {
        type: 'array',
        items: {
          type: 'object',
          required: ['instruction', 'ingredients'],
          properties: {
            name: { type: 'string' },
            instruction: { type: 'string' },
            ingredients: {
              type: 'array',
              items: {
                type: 'object',
                required: ['food'],
                properties: {
                  amount: { type: ['number', 'null'] },
                  unit: { type: ['string', 'null'], description: 'ex. g, ml, c. à soupe, c. à café ; null si sans unité.' },
                  food: { type: 'string', description: 'Nom de l\'aliment, au singulier/naturel, sans quantité.' },
                  note: { type: 'string', description: 'ex. « émincé », « en conserve, égoutté ».' }
                }
              }
            }
          }
        }
      },
      keywords: { type: 'array', items: { type: 'string' } },
      dish_photo_index: { type: ['integer', 'null'], description: 'Numéro (à partir de 0) de la photo qui montre le plat fini. null s\'il n\'y en a pas. Ne jamais désigner une page de texte.' },
      image_search_query: { type: 'string', description: 'Requête courte EN ANGLAIS pour trouver une photo du plat sur Wikimedia Commons (ex. « white bean rosti »).' },
      image_prompt: { type: 'string', description: 'Prompt EN ANGLAIS pour générer une photo culinaire réaliste du plat.' },
      notes: { type: 'string', description: 'Remarques pour l\'utilisateur : passages illisibles, valeurs incertaines, ou recette reconstituée faute de texte.' }
    }
  }
};

const SYSTEM_PROMPT = `Tu analyses des photos liées à une recette de cuisine : pages de livre, captures d'écran, notes manuscrites, et/ou photo du plat fini. Chaque image est précédée de son numéro (Photo 0, Photo 1…). Du texte peut aussi être fourni : légende (description) et commentaires d'un post Instagram / Facebook / Reel, où la recette se trouve souvent.
1. Extrais fidèlement tout le texte de la recette présent sur les photos, dans l'ordre de lecture (les recettes peuvent s'étendre sur plusieurs photos).
2. Traduis en français si le texte est dans une autre langue. Ne convertis pas les quantités ni les unités : traduis seulement leur nom (cups → tasses, tbsp → c. à soupe, tsp → c. à café). Utilise les abréviations courantes : g, kg, ml, l, c. à soupe, c. à café.
3. Structure en étapes ; regroupe les ingrédients dans l'étape où ils sont utilisés. Mots-clés : quelques étiquettes courtes en minuscules (régime, type de plat…).
4. N'invente aucun ingrédient, quantité ou étape absents des photos ; signale ce qui est illisible ou incertain dans « notes ».
4b. Dans un texte de réseau social : ignore hashtags, mentions, emojis décoratifs, appels à s'abonner, promotions et commentaires d'autres personnes qui ne font pas partie de la recette ; garde une correction ou précision donnée par le créateur. Si des quantités ne sont pas indiquées, n'en invente pas (amount null) et signale-le dans « notes ».
5. Si ni les photos ni le texte ne contiennent de recette (uniquement le plat), propose une recette plausible et courante pour ce plat, et dis-le clairement dans « notes ».
6. Si un lien est fourni, lis la page avec l'outil web_fetch (légende, description, texte de la page ; pour une vidéo, sa description). Si la page est inaccessible (connexion requise, contenu vide) ou ne contient pas la recette, ne l'invente pas : appuie-toi sur les autres sources ; s'il n'y en a aucune, explique en une phrase pourquoi, sans appeler submit_recipe.
Termine par l'outil submit_recipe.`;

function toTandoorPayload(r) {
  return {
    name: r.name,
    description: r.description || '',
    servings: r.servings || 1,
    servings_text: r.servings_text || 'portion',
    working_time: r.working_time || 0,
    waiting_time: r.waiting_time || 0,
    steps: (r.steps || []).map(s => ({
      name: s.name || '',
      instruction: s.instruction || '',
      ingredients: (s.ingredients || []).map((i, k) => ({
        amount: typeof i.amount === 'number' ? i.amount : 0,
        note: i.note || '',
        unit: i.unit ? { name: i.unit } : null,
        food: { name: i.food },
        order: k + 1
      }))
    })),
    keywords: (r.keywords || []).map(name => ({ name }))
  };
}

async function analyzePhotos() {
  const key = localStorage.getItem('anthropic_key') || '';
  if (!key) { alert('Renseigne ta clé API Anthropic dans « Connexion » puis enregistre.'); return; }
  const postText = $('postText').value.trim();
  const postUrl = $('postUrl').value.trim();
  const hasUrl = /^https?:\/\/\S+/i.test(postUrl);
  if (!photos.length && !postText && !hasUrl) { alert('Ajoute au moins une photo, un texte ou un lien.'); return; }
  busy.analyze = true; updateUI();
  log('photoLog', hasUrl ? 'Lecture du lien et analyse en cours…' : 'Analyse en cours…');
  const content = [];
  if (postText) content.push({ type: 'text', text: 'Texte fourni par l\'utilisateur (légende et commentaires d\'un post) :\n"""\n' + postText + '\n"""' });
  if (postUrl) content.push({ type: 'text', text: hasUrl
    ? 'Lien à consulter : ' + postUrl + '\nLis cette page avec l\'outil web_fetch (légende, description, contenu) pour trouver la recette.'
    : 'Source : ' + postUrl });
  photos.forEach((p, i) => {
    content.push({ type: 'text', text: 'Photo ' + i + ' :' });
    content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.b64 } });
  });
  content.push({ type: 'text', text: 'Extrais et traduis la recette.' });
  try {
    const r = await callClaude(SYSTEM_PROMPT, content, RECIPE_TOOL, {
      web: hasUrl,
      onNoWeb: () => log('photoLog', 'Lecture du lien indisponible avec ce modèle : analyse sans le lien.')
    });
    const np = toTandoorPayload(r);
    if (postUrl) np.source_url = postUrl;
    setRecipe(JSON.stringify(np, null, 2));
    log('photoLog', 'Recette extraite : ' + r.name, 'ok');
    if (r.notes) log('photoLog', '' + r.notes);
    await prepareImageQueue(r);
    await nextCandidate();
    await calcNutrition();
    if (mobStep === 2 && !isDesktop()) goStep(3);
  } catch (e) {
    log('photoLog', 'Échec : ' + e.message, 'err');
  } finally {
    busy.analyze = false; updateUI();
  }
}

// ---------- Coût IA ----------
// $ US par million de tokens (entrée, sortie), par préfixe de modèle
const PRICES = [['claude-sonnet-5', 2, 10], ['claude-sonnet-4', 3, 15], ['claude-opus', 5, 25], ['claude-fable', 10, 50], ['claude-mythos', 10, 50], ['claude-haiku', 1, 5]];
let usage = { inp: 0, out: 0, calls: 0, cost: 0, priced: true };

function resetUsage() {
  usage = { inp: 0, out: 0, calls: 0, cost: 0, priced: true };
  renderCost();
}
function trackUsage(model, u) {
  if (!u) return;
  const inp = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) + (u.cache_read_input_tokens || 0);
  const out = u.output_tokens || 0;
  usage.inp += inp; usage.out += out; usage.calls++;
  const price = PRICES.find(x => model.startsWith(x[0]));
  if (price) usage.cost += (inp * price[1] + out * price[2]) / 1e6; else usage.priced = false;
  renderCost();
}
function renderCost() {
  const c = $('costInfo');
  if (!usage.calls) { c.textContent = ''; return; }
  c.textContent = 'IA : ' + (usage.inp + usage.out).toLocaleString('fr-CA') + ' tokens'
    + (usage.priced ? ' · ≈ ' + usage.cost.toFixed(usage.cost < 0.1 ? 3 : 2).replace('.', ',') + ' $ US' : '');
  draftDirty();
}

function webFetchTool(model) {
  const modern = /claude-(sonnet-5|opus-5|opus-4-[678]|sonnet-4-6|fable|mythos)/.test(model);
  return { type: modern ? 'web_fetch_20260209' : 'web_fetch_20250910', name: 'web_fetch', max_uses: 3 };
}

async function callClaude(system, content, tool, opts = {}) {
  const key = localStorage.getItem('anthropic_key') || '';
  if (!key) throw new Error('clé API Anthropic manquante (section « Connexion »)');
  const model = localStorage.getItem('claude_model') || DEFAULT_MODEL;
  let web = !!opts.web;
  const messages = [{ role: 'user', content }];
  for (let turn = 0; turn < 6; turn++) {
    const body = { model, max_tokens: 8000, system, messages, tools: web ? [webFetchTool(model), tool] : [tool] };
    if (!web) body.tool_choice = { type: 'tool', name: tool.name };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (web && turn === 0 && res.status === 400) {   // outil de lecture de page refusé : on continue sans
        web = false;
        if (opts.onNoWeb) opts.onNoWeb();
        continue;
      }
      throw new Error('API ' + res.status + ' — ' + ((data.error && data.error.message) || JSON.stringify(data)));
    }
    trackUsage(model, data.usage);
    const use = (data.content || []).find(b => b.type === 'tool_use' && b.name === tool.name);
    if (use) return use.input;
    if (data.stop_reason === 'pause_turn') {           // lecture de page en cours côté serveur
      messages.push({ role: 'assistant', content: data.content });
      continue;
    }
    const txt = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ').trim();
    throw new Error(txt ? txt.slice(0, 400) : 'réponse inattendue de Claude');
  }
  throw new Error('la lecture du lien a pris trop d\'étapes');
}

const NUTRI_PROMPT = `Tu estimes les apports nutritionnels d'une recette. Pour CHAQUE ingrédient listé (fusionne les doublons), donne les valeurs pour la QUANTITÉ TOTALE utilisée dans la recette, pas pour 100 g, d'après les tables de composition usuelles (CIQUAL / USDA).
- Tiens compte de l'état de l'ingrédient (en conserve égoutté, cru/cuit, etc.) et convertis les mesures en grammes de façon raisonnable.
- Ingrédients sans quantité (« au goût », « pincée », garniture non chiffrée) : compte-les à ~0 et signale-le dans « assumptions ».
- Ne compte que ce qui est dans la liste d'ingrédients ; ne suppose pas d'ajouts.

Réponds uniquement via l'outil submit_nutrition.`;

let nutri = null;    // { total, perPortion, servings, rows, assumptions }
let nutriFor = '';   // valeur du JSON pour laquelle le calcul a été fait

const r1 = n => Math.round((Number(n) || 0) * 10) / 10;
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
// Micronutriments : ref = apport de référence journalier (UE), vegan = à surveiller en alimentation végane
const MICRO = [
  { k: 'vitamin_b12', label: 'Vitamine B12', unit: 'µg', ref: 2.5, vegan: true },
  { k: 'iron', label: 'Fer', unit: 'mg', ref: 14, vegan: true },
  { k: 'zinc', label: 'Zinc', unit: 'mg', ref: 10, vegan: true },
  { k: 'calcium', label: 'Calcium', unit: 'mg', ref: 800, vegan: true },
  { k: 'iodine', label: 'Iode', unit: 'µg', ref: 150, vegan: true },
  { k: 'vitamin_d', label: 'Vitamine D', unit: 'µg', ref: 5, vegan: true },
  { k: 'selenium', label: 'Sélénium', unit: 'µg', ref: 55, vegan: true },
  { k: 'omega3', label: 'Oméga-3', unit: 'g', ref: null, vegan: true },
  { k: 'magnesium', label: 'Magnésium', unit: 'mg', ref: 375 },
  { k: 'salt', label: 'Sel', unit: 'g', ref: null }
];
const fmtNum = n => String(n).replace('.', ',');
function microLine() {
  const pp = nutri.perPortion;
  return ['vitamin_b12', 'iron', 'zinc', 'calcium', 'iodine'].map(k => {
    const m = MICRO.find(x => x.k === k);
    return m.label.replace('Vitamine ', '') + ' ' + fmtNum(pp[k]) + ' ' + m.unit;
  }).join(' · ');
}
const sumKey = (rows, k) => rows.reduce((a, r) => a + (Number(r[k]) || 0), 0);

async function calcNutrition() {
  const src = document.getElementById('recipeJson').value;
  let p;
  try { p = JSON.parse(src); } catch (e) { log('nutriLog', 'JSON invalide : ' + e.message, 'err'); return; }
  if (!localStorage.getItem('anthropic_key')) { log('nutriLog', 'Clé API Anthropic requise pour le calcul.', 'err'); return; }
  busy.nutri = true; updateUI();
  log('nutriLog', 'Calcul en cours…');
  try {
    const r = fromTandoorPayload(p);
    const list = r.steps.flatMap(s => s.ingredients);
    const out = await callClaude(NUTRI_PROMPT, [{
      type: 'text',
      text: 'Recette « ' + r.name + ' » — ' + (r.servings || 1) + ' ' + (r.servings_text || 'portion(s)') + '.\nIngrédients :\n' + JSON.stringify(list)
    }], NUTRI_TOOL);
    const rows = out.ingredients || [];
    const servings = Number(p.servings) > 0 ? Number(p.servings) : 1;
    const keys = ['calories', 'proteins', 'carbohydrates', 'sugars', 'fibers', 'fats', 'saturated_fats', ...MICRO.map(m => m.k)];
    const total = {}, perPortion = {};
    keys.forEach(k => {
      const rnd = MICRO.some(m => m.k === k) ? r2 : r1;
      total[k] = rnd(sumKey(rows, k));
      perPortion[k] = rnd(sumKey(rows, k) / servings);
    });
    nutri = { total, perPortion, servings, rows, assumptions: out.assumptions || '' };
    nutriFor = src;
    renderNutrition();
    log('nutriLog', perPortion.calories + ' kcal par portion.', 'ok');
  } catch (e) {
    log('nutriLog', 'Échec : ' + e.message, 'err');
  } finally {
    busy.nutri = false; updateUI();
  }
}

// ---------- Recadrage ----------
let cropState = null;
const clamp =(v, a, b) => Math.max(a, Math.min(b, v));
const CROP_MIN = 30;

function openCrop(blob, onDone) {
  const img = $('cropImg');
  cropState = { url: URL.createObjectURL(blob), onDone, ratio: null, r: null, W: 0, H: 0, drag: null };
  $('cropModal').hidden = false;
  img.onload = () => {
    cropState.W = img.clientWidth;
    cropState.H = img.clientHeight;
    setRatio('free', true);
  };
  img.src = cropState.url;
}

function closeCrop() {
  if (cropState) URL.revokeObjectURL(cropState.url);
  cropState = null;
  $('cropModal').hidden = true;
}

function setRatio(key, init) {
  const s = cropState;
  if (!s) return;
  s.ratio = key === 'free' ? null : Number(key);
  document.querySelectorAll('#cropRatios button').forEach(b => b.classList.toggle('on', b.dataset.r === key));
  if (key === 'free' && !init && s.r) { drawCrop(); return; }
  let w = s.W * 0.9, h = s.H * 0.9;
  if (s.ratio) { if (w / h > s.ratio) w = h * s.ratio; else h = w / s.ratio; }
  s.r = { x: (s.W - w) / 2, y: (s.H - h) / 2, w, h };
  drawCrop();
}

function drawCrop() {
  const r = cropState.r, e = $('cropRect');
  e.style.left = r.x + 'px'; e.style.top = r.y + 'px';
  e.style.width = r.w + 'px'; e.style.height = r.h + 'px';
}

$('cropRect').addEventListener('pointerdown', e => {
  const s = cropState;
  if (!s) return;
  s.drag = { mode: e.target.dataset.h || 'move', sx: e.clientX, sy: e.clientY, r0: { ...s.r } };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.preventDefault();
});

$('cropRect').addEventListener('pointermove', e => {
  const s = cropState;
  if (!s || !s.drag) return;
  const d = s.drag, r0 = d.r0;
  if (d.mode === 'move') {
    s.r.x = clamp(r0.x + e.clientX - d.sx, 0, s.W - r0.w);
    s.r.y = clamp(r0.y + e.clientY - d.sy, 0, s.H - r0.h);
  } else {
    const st = $('cropStage').getBoundingClientRect();
    const px = clamp(e.clientX - st.left, 0, s.W), py = clamp(e.clientY - st.top, 0, s.H);
    const left = d.mode.includes('w'), top = d.mode.includes('n');
    const fx = left ? r0.x + r0.w : r0.x, fy = top ? r0.y + r0.h : r0.y;
    const maxW = left ? fx : s.W - fx, maxH = top ? fy : s.H - fy;
    let w = clamp(left ? fx - px : px - fx, CROP_MIN, maxW);
    let h = clamp(top ? fy - py : py - fy, CROP_MIN, maxH);
    if (s.ratio) {
      if (w / h > s.ratio) w = h * s.ratio; else h = w / s.ratio;
      if (w > maxW) { w = maxW; h = w / s.ratio; }
      if (h > maxH) { h = maxH; w = h * s.ratio; }
    }
    s.r = { x: left ? fx - w : fx, y: top ? fy - h : fy, w, h };
  }
  drawCrop();
});

['pointerup', 'pointercancel'].forEach(ev => $('cropRect').addEventListener(ev, () => { if (cropState) cropState.drag = null; }));

window.addEventListener('resize', () => {
  const s = cropState, img = $('cropImg');
  if (!s || $('cropModal').hidden || !s.W || !img.clientWidth) return;
  const k = img.clientWidth / s.W;
  s.r = { x: s.r.x * k, y: s.r.y * k, w: s.r.w * k, h: s.r.h * k };
  s.W = img.clientWidth; s.H = img.clientHeight;
  drawCrop();
});

function applyCrop() {
  const s = cropState, img = $('cropImg');
  if (!s) return;
  const k = img.naturalWidth / s.W;
  const sx = s.r.x * k, sy = s.r.y * k, sw = s.r.w * k, sh = s.r.h * k;
  const scale = Math.min(1, 2000 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const onDone = s.onDone;
  c.toBlob(b => {
    closeCrop();
    if (b) onDone(b); else alert('Recadrage impossible.');
  }, 'image/jpeg', 0.9);
}

// ---------- Image de la recette ----------
async function wikimediaCandidates(q) {
  const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8'
    + '&gsrsearch=' + encodeURIComponent(q + ' filetype:bitmap')
    + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=1200';
  const d = await (await fetch(u)).json();
  const pages = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index);
  return pages
    .filter(p => p.imageinfo && p.imageinfo[0].mime === 'image/jpeg')
    .map(p => ({
      kind: 'wikimedia',
      url: p.imageinfo[0].thumburl || p.imageinfo[0].url,
      label: 'Wikimedia Commons — ' + p.title.replace(/^File:/, '') + ' (vérifie la licence : ' + p.imageinfo[0].descriptionurl + ')'
    }));
}

async function prepareImageQueue(r) {
  queue = [];
  const i = r.dish_photo_index;
  if (Number.isInteger(i) && photos[i]) {
    queue.push({ kind: 'photo', blob: photos[i].blob, label: 'Ta photo n°' + (i + 1) + ' (plat fini)' });
  }
  try {
    (await wikimediaCandidates(r.image_search_query || r.name)).forEach(c => queue.push(c));
  } catch (e) {
    log('imageLog', 'Recherche Wikimedia impossible : ' + e.message, 'err');
  }
  queue.push({ kind: 'ai', prompt: r.image_prompt || ('appetizing photo of ' + r.name), seed: 1 });
}

// Cherche une image sur Internet pour la recette courante (nouvelle ou existante), ou charge un lien d'image
// « Autre » : image suivante ; s'il n'y en a pas encore, lance la recherche (nom de la recette ou mots-clés saisis)
async function nextOrSearch() {
  if (queue.length) await nextCandidate();
  else await searchImages();
}

async function searchImages() {
  const raw = $('imgQuery').value.trim();
  if (/^https?:\/\/\S+$/i.test(raw)) { await loadImageUrl(raw); return; }
  let name = '';
  try { name = JSON.parse($('recipeJson').value).name || ''; } catch (e) {}
  const q = raw || name;
  if (!q) { log('imageLog', 'Indique des mots-clés ou charge une recette.', 'err'); return; }
  log('imageLog', 'Recherche en cours…');
  queue = [];
  try {
    (await wikimediaCandidates(q)).forEach(c => queue.push(c));
  } catch (e) {
    log('imageLog', 'Recherche Wikimedia impossible : ' + e.message, 'err');
  }
  queue.push({ kind: 'ai', prompt: 'appetizing food photo of ' + q, seed: 1 });
  updateUI();
  await nextCandidate();
}

async function loadImageUrl(u) {
  log('imageLog', 'Téléchargement de l\'image…');
  try {
    const res = await fetchT(u, {}, 20000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    if (!blob.type.startsWith('image/')) throw new Error('ce lien n\'est pas une image');
    setCurrent(await resizeToJpeg(blob), 'Image du lien : ' + u);
  } catch (e) {
    log('imageLog', 'Impossible de charger ce lien (' + e.message + '). Beaucoup de sites interdisent le téléchargement depuis une page web : enregistre l\'image sur ton appareil puis utilise « Choisir une image ».', 'err');
  }
}

async function loadCandidate(c) {
  if (c.blob) return c.blob;
  const src = c.kind === 'ai'
    ? 'https://image.pollinations.ai/prompt/' + encodeURIComponent(c.prompt) + '?width=1024&height=768&nologo=true&seed=' + c.seed
    : c.url;
  const res = await fetch(src);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  if (!blob.type.startsWith('image/')) throw new Error('réponse non image');
  return blob;
}

async function nextCandidate() {
  while (queue.length) {
    const c = queue.shift();
    if (c.kind === 'ai') log('imageLog', 'Génération de l\'image…');
    try {
      const blob = await loadCandidate(c);
      if (c.kind === 'ai') queue.push({ ...c, seed: c.seed + 1 });
      setCurrent(blob, c.kind === 'ai' ? 'Image générée par IA (Pollinations) — variante ' + c.seed : c.label);
      return true;
    } catch (e) {
      log('imageLog', 'Proposition ignorée (' + c.kind + ') : ' + e.message, 'err');
    }
  }
  updateUI();
  log('imageLog', 'Plus de proposition disponible. Choisis ton propre fichier.', 'err');
  return false;
}

// Distingue « serveur injoignable » de « bloqué par CORS ».
async function netHint(url) {
  try {
    await fetchT(url + '/api/', { mode: 'no-cors' }, 6000);
    return ' — le serveur répond, donc la requête est bloquée par CORS : autorise ' + location.origin + ' côté Tandoor / reverse proxy (Access-Control-Allow-Origin, Allow-Headers: authorization, et réponse aux requêtes OPTIONS).';
  } catch (e) {
    return ' — ' + url + ' est injoignable depuis ce navigateur (hors de ton réseau local ? port 443 non redirigé, certificat invalide, ou URL http bloquée depuis une page https).';
  }
}

async function apiGet(url, token, path, ms = 15000) {
  const r = await fetchT(url + path, { headers: { 'Authorization': 'Bearer ' + token } }, ms);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('erreur ' + r.status);
  return d;
}

// ---------- Connexion : accordéon + test ----------
function setAuthOpen(open) {
  $('authBody').hidden = !open;
  $('authToggle').setAttribute('aria-expanded', String(open));
  $('authChevron').style.transform = open ? 'rotate(180deg)' : '';
  try { localStorage.setItem('auth_open', open ? '1' : '0'); } catch (e) {}
}
function toggleAuth() { setAuthOpen($('authBody').hidden); }

async function testConnection() {
  const { url, token } = getAuth();
  const info = $('authInfo');
  if (!url || !token) { info.textContent = 'Enregistre d\'abord l\'adresse et le token.'; return; }
  info.textContent = 'Test en cours…';
  const lines = ['Page : ' + location.origin + location.pathname, 'Serveur : ' + url];
  if (location.protocol === 'https:' && /^http:/i.test(url)) {
    lines.push('Problème : la page est en HTTPS et l\'adresse Tandoor en HTTP, le navigateur bloque ce mélange.');
  }
  // 1. le serveur est-il joignable (réseau + certificat) ?
  let reachable = false;
  try {
    await fetchT(url + '/api/', { mode: 'no-cors' }, 8000);
    reachable = true;
    lines.push('1. Serveur joignable : oui');
  } catch (e) {
    lines.push('1. Serveur joignable : NON (' + e.message + ')');
  }
  // 2. l'API répond-elle avec le token (CORS compris) ?
  try {
    const r = await fetchT(url + '/api/recipe/?page_size=1', { headers: { 'Authorization': 'Bearer ' + token } }, 10000);
    if (r.ok) {
      const d = await r.json().catch(() => ({}));
      info.textContent = 'Connexion OK' + (d.count != null ? ' (' + d.count + ' recettes).' : '.');
      return;
    }
    lines.push('2. API avec token : HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' (token refusé)' : ''));
  } catch (e) {
    lines.push('2. API avec token : échec (' + e.message + ')' + (reachable ? ' — le serveur est joignable, donc requête bloquée par CORS ou par le navigateur' : ''));
  }
  info.textContent = lines.join('\n');
}

// ---------- Brouillon local (IndexedDB) : la recette reste sur l'appareil tant qu'elle n'est pas envoyée ----------
const DB_NAME = 'tandoor-import', DRAFT_KEY = 'draft';
let draftReady = false, saveTimer = null;

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const req = db.transaction('kv').objectStore('kv').get(k);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDel(k) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').delete(k);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function draftDirty() {
  if (!draftReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 500);
}

async function saveDraft() {
  try {
    const json = $('recipeJson').value;
    const postText = $('postText').value, postUrl = $('postUrl').value;
    const empty = !json.trim() && !photos.length && !postText.trim() && !postUrl.trim();
    const alreadySent = sent && sent.done && sent.json === json;
    if (empty || alreadySent) { await idbDel(DRAFT_KEY); $('draftInfo').textContent = ''; return; }
    await idbSet(DRAFT_KEY, { json, postText, postUrl, photos, current, undoStack, nutri, nutriFor, usage, editing, sent });
    $('draftInfo').textContent = 'Brouillon gardé sur cet appareil';
  } catch (e) {
    $('draftInfo').textContent = '';
  }
}

async function restoreDraft() {
  try {
    const d = await idbGet(DRAFT_KEY);
    if (d) {
      $('postText').value = d.postText || '';
      $('postUrl').value = d.postUrl || '';
      photos = d.photos || [];
      undoStack = d.undoStack || [];
      nutri = d.nutri || null;
      nutriFor = d.nutriFor || '';
      usage = d.usage || usage;
      editing = d.editing || null;
      sent = d.sent || null;
      $('recipeJson').value = d.json || '';
      renderThumbs();
      if (d.current && d.current.blob) setCurrent(d.current.blob, d.current.label, d.current.orig, d.current.existing, d.current.origExisting);
      if (nutri) renderNutrition();
      renderCost();
      renderPreview();
      $('draftInfo').textContent = 'Brouillon restauré';
    }
  } catch (e) { /* IndexedDB indisponible : on continue sans brouillon */ }
  draftReady = true;
}

// ---------- Nouvelle recette / recette existante ----------
let editing = null;   // { id, name } quand on modifie une recette déjà présente dans Tandoor

function workIsSafe() {
  const has = $('recipeJson').value.trim() || photos.length || $('postText').value.trim();
  return !has || (sent && sent.done && sent.json === $('recipeJson').value);
}
function confirmDiscard() {
  return workIsSafe() || confirm('Remplacer la recette en cours ? Elle n\'a pas encore été envoyée.');
}

function resetWork() {
  photos = [];
  ['postText', 'postUrl', 'recipeJson', 'modText', 'kwInput'].forEach(id => { $(id).value = ''; });
  undoStack = []; nutri = null; nutriFor = ''; queue = []; current = null; editing = null; sent = null;
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  ['pvImg', 'pvImg2'].forEach(id => { $(id).hidden = true; $(id).removeAttribute('src'); });
  $('pvNoImg').hidden = false;
  $('candLabel').textContent = ''; $('candLabel2').textContent = '';
  $('nutriBox').textContent = '';
  ['photoLog', 'modLog', 'nutriLog', 'imageLog', 'importLog', 'editLog'].forEach(id => { $(id).textContent = ''; });
  resetUsage();
  renderThumbs();
  renderPreview();
}

function newRecipe() {
  if (!confirmDiscard()) return;
  resetWork();
  idbDel(DRAFT_KEY).catch(() => {});
  goStep(2);
}

function fromTandoorApi(r) {
  const p = {
    name: r.name || '',
    description: r.description || '',
    servings: r.servings || 1,
    servings_text: r.servings_text || '',
    working_time: r.working_time || 0,
    waiting_time: r.waiting_time || 0,
    steps: (r.steps || []).map(s => ({
      name: s.name || '',
      instruction: s.instruction || '',
      ingredients: (s.ingredients || []).filter(i => i.food && i.food.name).map((i, k) => ({
        amount: Number(i.amount) || 0,
        note: i.note || '',
        unit: i.unit && i.unit.name ? { name: i.unit.name } : null,
        food: { name: i.food.name },
        order: k + 1
      }))
    })),
    keywords: (r.keywords || []).map(k => ({ name: k.name }))
  };
  if (r.source_url) p.source_url = r.source_url;
  return p;
}

async function searchRecipes() {
  const { url, token } = getAuth();
  if (!url || !token) { log('editLog', 'Connexion manquante (étape 1).', 'err'); return; }
  const q = $('editQuery').value.trim();
  const box = $('editList');
  box.textContent = 'Chargement…';
  try {
    const d = await apiGet(url, token, '/api/recipe/?page_size=20&sort_order=-created_at' + (q ? '&query=' + encodeURIComponent(q) : ''));
    box.textContent = '';
    const rows = (d.results || []).sort((a, b) => b.id - a.id);
    if (!rows.length) { box.textContent = 'Aucun résultat.'; return; }
    rows.forEach(r => {
      const b = el('button', 'listrow');
      b.append(el('span', 'truncate', r.name), el('span', 'text-xs text-mute', '#' + r.id));
      b.onclick = () => openExisting(r.id);
      box.append(b);
    });
  } catch (e) {
    box.textContent = '';
    log('editLog', 'Échec : ' + e.message + await netHint(url), 'err');
  }
}

// Affiche l'image actuelle d'une recette Tandoor (token d'abord, puis cookie de session si même origine)
async function loadExistingImage(r, url, token) {
  const src = r.image || r.image_url;
  if (!src) return;
  let u;
  try { const a = new URL(src, url); u = new URL(a.pathname + a.search, url).href; } catch (e) { return; }
  const tries = [{ headers: { 'Authorization': 'Bearer ' + token } }];
  if (new URL(u).origin === location.origin) tries.push({ credentials: 'include' });
  for (const t of tries) {
    try {
      const res = await fetchT(u, t, 15000);
      if (!res.ok) continue;
      const blob = await res.blob();
      if (!blob.type.startsWith('image/')) continue;
      if (editing && editing.id === r.id && !current) setCurrent(blob, 'Image actuelle de la recette', blob, true);
      return;
    } catch (e) { /* essai suivant */ }
  }
  log('imageLog', 'Image actuelle non affichable (Tandoor refuse l\'accès avec ce token).');
}

async function openExisting(id) {
  const { url, token } = getAuth();
  if (!url || !token) { log('editLog', 'Connexion manquante (étape 1).', 'err'); return; }
  if (!confirmDiscard()) return;
  try {
    const r = await apiGet(url, token, '/api/recipe/' + id + '/');
    resetWork();
    editing = { id: r.id, name: r.name };
    setRecipe(JSON.stringify(fromTandoorApi(r), null, 2));
    log('editLog', 'Recette chargée : ' + r.name);
    goStep(3);
    loadExistingImage(r, url, token);
  } catch (e) {
    log('editLog', 'Échec : ' + e.message + await netHint(url), 'err');
  }
}

// ---------- Historique des recettes envoyées ----------
const HIST_KEY = 'import_history';
function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { return []; }
}
function addHistory(entry) {
  const h = getHistory().filter(x => !(x.id === entry.id && x.url === entry.url));
  h.unshift(entry);
  try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 20))); } catch (e) {}
  renderHistory();
}
let remoteHist = null;   // dernières recettes lues dans Tandoor (null = indisponible)
let histError = '';

async function loadRecent() {
  const { url, token } = getAuth();
  if (!url || !token) { remoteHist = null; histError = ''; renderHistory(); return; }
  try {
    const d = await apiGet(url, token, '/api/recipe/?page_size=10&sort_order=-created_at', 8000);
    remoteHist = (d.results || [])
      .map(r => ({ id: r.id, name: r.name, url, t: Date.parse(r.created_at || r.updated_at) || 0 }))
      .sort((a, b) => (b.t - a.t) || (b.id - a.id))
      .slice(0, 10);
    histError = '';
  } catch (e) {
    remoteHist = null;
    histError = 'Liste Tandoor indisponible (' + e.message + ').';
  }
  renderHistory();
}

function renderHistory() {
  const { url: cur, token } = getAuth();
  const local = getHistory();
  const items = remoteHist || local;
  $('histSection').hidden = !(cur && token) && !items.length;
  const box = $('histList');
  box.textContent = '';
  const mine = new Set(local.filter(x => x.url === cur).map(x => x.id));
  items.forEach(x => {
    const row = el('div', 'hist-row');
    const info = el('div', 'min-w-0');
    const when = x.t ? new Date(x.t).toLocaleString('fr-CA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    info.append(
      el('div', 'truncate text-sm font-semibold', x.name),
      el('div', 'muted', [when, mine.has(x.id) ? 'envoyée depuis cette page' : ''].filter(Boolean).join(' · '))
    );
    const acts = el('div', 'grid grid-cols-3 gap-2 sm:flex sm:shrink-0');
    const open = el('a', 'btn mt-0 w-full px-3 py-1.5 text-center text-xs sm:w-auto', 'Ouvrir');
    open.href = x.url + '/view/recipe/' + x.id; open.target = '_blank'; open.rel = 'noopener';
    const edit = el('button', 'btn mt-0 w-full px-3 py-1.5 text-xs sm:w-auto', 'Modifier');
    edit.onclick = () => openExisting(x.id);
    if (x.url !== cur) edit.disabled = true;
    const del = el('button', 'btn mt-0 w-full px-3 py-1.5 text-xs text-err sm:w-auto', 'Supprimer');
    del.onclick = () => deleteRecent(x);
    if (x.url !== cur) del.disabled = true;
    acts.append(open, edit, del);
    row.append(info, acts);
    box.append(row);
  });
  $('histNote').textContent = remoteHist
    ? (items.length ? '' : 'Aucune recette dans Tandoor.')
    : (histError ? histError + (local.length ? ' Historique de cette page affiché.' : '') : '');
}

async function deleteRecent(x) {
  const { url, token } = getAuth();
  if (!url || !token || x.url !== url) return;
  if (!confirm('Supprimer « ' + x.name + ' » de Tandoor ?\nCette action est définitive.')) return;
  try {
    const res = await fetchT(url + '/api/recipe/' + x.id + '/', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } }, 15000);
    if (res.ok || res.status === 404) {
      try { localStorage.setItem(HIST_KEY, JSON.stringify(getHistory().filter(h => !(h.id === x.id && h.url === x.url)))); } catch (e) {}
      if (editing && editing.id === x.id) editing = null;
      await loadRecent();
      updateUI();
      log('histLog', res.ok ? 'Recette supprimée : ' + x.name : 'Déjà absente de Tandoor, retirée de la liste.', 'ok');
    } else {
      log('histLog', 'Suppression refusée (' + res.status + ').', 'err');
    }
  } catch (e) {
    log('histLog', 'Échec réseau : ' + e.message + await netHint(url), 'err');
  }
}

// ---------- Mots-clés ----------
function editKeywords(fn) {
  let p;
  try { p = JSON.parse($('recipeJson').value); } catch (e) { return; }
  const wasFresh = nutri && nutriFor === $('recipeJson').value;
  p.keywords = fn((p.keywords || []).map(k => ({ name: k.name || String(k) })));
  const next = JSON.stringify(p, null, 2);
  setRecipe(next);
  if (wasFresh) { nutriFor = next; renderPreview(); }   // les mots-clés ne changent pas la nutrition
}
function addKeyword() {
  const v = $('kwInput').value.trim();
  if (!v) return;
  editKeywords(k => k.some(x => x.name.toLowerCase() === v.toLowerCase()) ? k : [...k, { name: v }]);
  $('kwInput').value = '';
}
function removeKeyword(i) { editKeywords(k => k.filter((_, j) => j !== i)); }
function renderKeywords(p) {
  const box = $('kwList');
  box.textContent = '';
  ((p && p.keywords) || []).forEach((k, i) => {
    const chip = el('span', 'chip', k.name || String(k));
    const x = el('button', '', '×');
    x.setAttribute('aria-label', 'Retirer ' + (k.name || k));
    x.onclick = () => removeKeyword(i);
    chip.append(x);
    box.append(chip);
  });
}

// ---------- Envoi ----------
async function importRecipe() {
  const { url, token } = getAuth();
  if (!url || !token) { alert('Connecte-toi d\'abord.'); return; }
  const src = $('recipeJson').value;
  let payload;
  try {
    payload = JSON.parse(src);
  } catch (e) {
    log('importLog', 'JSON invalide : ' + e.message, 'err');
    return;
  }
  const same = sent && sent.json === src && !editing;
  const retryImage = same && !sent.done;     // recette déjà créée, seule l'image est à renvoyer
  if (same && sent.done && !confirm('Cette recette a déjà été envoyée (ID ' + sent.id + '). Envoyer à nouveau créera un doublon. Continuer ?')) return;

  if (!retryImage && nutri && $('nutriSave').checked) {
    if (nutriFor === src) {
      const p = nutri.perPortion;
      payload.nutrition = { calories: p.calories, proteins: p.proteins, carbohydrates: p.carbohydrates, fats: p.fats, source: 'Estimation Claude' };
      const line = 'Par portion (estimation) : ' + p.calories + ' kcal · ' + p.proteins + ' g protéines · ' + p.carbohydrates + ' g glucides · ' + p.fats + ' g lipides.';
      const d = payload.description ? payload.description + '\n' + line : line;
      if (d.length <= 512) payload.description = d;
    } else {
      log('importLog', 'Nutrition non incluse : recalcule-la (la recette a changé).');
    }
  }

  $('importLog').textContent = '';
  log('importLog', 'Envoi en cours…');
  busy.send = true; updateUI();
  try {
    let id;
    if (retryImage) {
      id = sent.id;
    } else {
      const res = await fetchT(url + '/api/recipe/' + (editing ? editing.id + '/' : ''), {
        method: editing ? 'PATCH' : 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify(payload)
      }, 20000);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        log('importLog', 'Erreur ' + res.status + ' — ' + JSON.stringify(data).slice(0, 300) + '\nLa recette reste gardée sur cet appareil.', 'err');
        return;
      }
      id = data.id;
      sent = { id, json: src, done: false, name: data.name || payload.name };
      log('importLog', (editing ? 'Recette mise à jour' : 'Recette créée') + ' (ID ' + id + ').', 'ok');
    }
    let imageOk = true;
    if (current && !current.existing) imageOk = await uploadImage(id, 'importLog');
    else if (!retryImage) log('importLog', current ? 'Image inchangée.' : 'Envoyée sans image.');
    if (imageOk) {
      sent.done = true;
      addHistory({ id, name: sent.name, url, t: Date.now(), edited: !!editing });
      loadRecent();
      try { await idbDel(DRAFT_KEY); } catch (e) {}
      $('draftInfo').textContent = '';
    } else {
      log('importLog', 'La recette est créée mais pas son image : clique à nouveau sur Envoyer pour réessayer l\'image.', 'err');
    }
  } catch (e) {
    log('importLog', 'Échec réseau : ' + e.message + await netHint(url) + '\nLa recette reste gardée sur cet appareil.', 'err');
  } finally {
    const wait = $('importLog').lastElementChild;
    if (wait && wait.textContent === 'Envoi en cours…') wait.remove();
    busy.send = false; updateUI();
  }
}

async function uploadImage(id, logEl = 'importLog') {
  const { url, token } = getAuth();
  const blob = current && current.blob;
  if (!blob) return false;
  const form = new FormData();
  form.append('image', blob, 'recette.jpg');
  try {
    const res = await fetchT(url + '/api/recipe/' + id + '/image/', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token },
      body: form
    }, 60000);
    if (res.ok) { log(logEl, 'Image envoyée.', 'ok'); return true; }
    log(logEl, 'Erreur image ' + res.status + ' — ' + (await res.text()).slice(0, 200), 'err');
  } catch (e) {
    log(logEl, 'Échec réseau (image) : ' + e.message, 'err');
  }
  return false;
}
