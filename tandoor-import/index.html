<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Tandoor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<style>
  :root {
    --bg: #f3eee8; --light: #ffffff; --dark: #d9d0c5;
    --ink: #212121; --mute: #67625c; --accent: #8f5f42;
    --bar: #f4ff77; --on-bar: #212121;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262422; --light: #312e2b; --dark: #1a1917; --ink: #f0ebe5; --mute: #aaa39b; --accent: #dba884; --bar: #dfe95f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--bar); color: var(--on-bar); padding: 14px 16px; font-weight: 700; font-size: 1.1rem; }
  main { max-width: 420px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--bg); border-radius: 24px; padding: 24px; box-shadow: 9px 9px 18px var(--dark), -9px -9px 18px var(--light); }
  h1 { font-size: 1.1rem; margin: 0 0 8px; }
  p { margin: 0; color: var(--mute); font-size: .9rem; line-height: 1.5; }
  #status { margin: 12px 0 20px; min-height: 2.6em; }
  a.btn { display: block; margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--bg); color: var(--accent); text-align: center; font-weight: 600; text-decoration: none; box-shadow: 5px 5px 10px var(--dark), -5px -5px 10px var(--light); }
  a.btn:active { box-shadow: inset 3px 3px 6px var(--dark), inset -3px -3px 6px var(--light); }
  a.btn small { display: block; margin-top: 2px; color: var(--mute); font-weight: 400; font-size: .75rem; }
</style>
</head>
<body>
<header>Import Tandoor</header>
<main>
  <div class="card">
    <h1>Où es-tu ?</h1>
    <p id="status">Recherche du meilleur accès…</p>
    <a class="btn" id="local" href="#">Réseau local<small id="localUrl"></small></a>
    <a class="btn" id="remote" href="#">À distance<small id="remoteUrl"></small></a>
  </div>
</main>

<script>
// ------------------------------------------------------------------
// Réglages : adresses de la page d'import et nom de domaine du serveur
// ------------------------------------------------------------------
var LOCAL_URL  = 'http://192.168.0.21:2001/import/';
var REMOTE_URL = 'https://cook.cabanologues.com/import/';
var HOST       = 'cook.cabanologues.com';   // son adresse IP publique = celle de ta maison

var statusEl = document.getElementById('status');
document.getElementById('local').href = LOCAL_URL;
document.getElementById('remote').href = REMOTE_URL;
document.getElementById('localUrl').textContent = LOCAL_URL.replace(/^https?:\/\//, '');
document.getElementById('remoteUrl').textContent = REMOTE_URL.replace(/^https?:\/\//, '');

function getJson(url, opts, ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms || 4000);
  opts = opts || {};
  opts.signal = ctl.signal;
  return fetch(url, opts).then(function (r) { return r.json(); }).finally(function () { clearTimeout(t); });
}

// adresse IPv4 publique de ce visiteur
function myIp() {
  return getJson('https://api.ipify.org?format=json').then(function (j) { return j.ip; });
}

// adresse IPv4 publique de la maison = enregistrement DNS du serveur
function homeIp() {
  function pick(j) {
    var a = (j.Answer || []).filter(function (x) { return x.type === 1; })[0];
    if (!a) throw new Error('pas de réponse DNS');
    return a.data;
  }
  return getJson('https://cloudflare-dns.com/dns-query?name=' + HOST + '&type=A', { headers: { accept: 'application/dns-json' } })
    .then(pick)
    .catch(function () { return getJson('https://dns.google/resolve?name=' + HOST + '&type=A').then(pick); });
}

var params = new URLSearchParams(location.search);
var forced = params.get('choix');           // ?choix=local ou ?choix=distant
var manual = params.has('manuel');          // ?manuel : ne pas rediriger

function go(url, msg) {
  statusEl.textContent = msg;
  if (!manual) location.replace(url);
}

if (forced === 'local') go(LOCAL_URL, 'Réseau local : redirection…');
else if (forced === 'distant') go(REMOTE_URL, 'Accès à distance : redirection…');
else {
  Promise.all([myIp(), homeIp()]).then(function (r) {
    var onHomeNetwork = r[0] === r[1];
    statusEl.textContent = (onHomeNetwork ? 'Tu es chez toi' : 'Tu es hors de chez toi') + ' (' + r[0] + ').' + (manual ? '' : ' Redirection…');
    if (!manual) location.replace(onHomeNetwork ? LOCAL_URL : REMOTE_URL);
  }).catch(function () {
    statusEl.textContent = 'Impossible de savoir où tu es. Choisis un accès :';
  });
}
</script>
<noscript><p style="padding:16px">JavaScript est nécessaire pour la détection ; utilise les boutons ci-dessus.</p></noscript>
</body>
</html>
