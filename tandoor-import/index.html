<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Import Tandoor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- ============================================================
     THÈME — tout le design se change ici (couleurs, ombres neumorphiques)
     ============================================================ -->
<style>
  :root {
    --neu-bg: #e3eef8;        /* fond de la page ET des éléments (indispensable au neumorphisme) */
    --neu-light: #f8fcff;     /* ombre claire (haut-gauche) */
    --neu-dark: #c2d3e5;      /* ombre sombre (bas-droite) */
    --neu-ink: #1d4553;       /* texte */
    --neu-mute: #587082;      /* texte secondaire */
    --neu-accent: #6a52c8;    /* accent (liens, icônes, texte des boutons) */
    --neu-accent-dark: #4f3aa8;
    --neu-grad: #6a52c8;      /* boutons principaux, étapes faites (peut être un linear-gradient(...)) */
    --neu-on-accent: #ffffff; /* texte sur fond d'accent */
    --neu-ok: #1f8a70;
    --neu-err: #cc4358;
    --neu-out:    10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light);
    --neu-out-sm: 6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light);
    --neu-in:     inset 6px 6px 14px var(--neu-dark), inset -6px -6px 14px var(--neu-light);
    --neu-in-sm:  inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --neu-bg: #232b36;
      --neu-light: #2d3745;
      --neu-dark: #181e26;
      --neu-ink: #e6f1f7;
      --neu-mute: #9fb2c1;
      --neu-accent: #a99cff;
      --neu-accent-dark: #c4baff;
      --neu-grad: #a99cff;
      --neu-on-accent: #141922;
    }
  }
</style>

<style type="text/tailwindcss">
  @theme {
    --color-base: var(--neu-bg);
    --color-ink: var(--neu-ink);
    --color-mute: var(--neu-mute);
    --color-accent: var(--neu-accent);
    --color-ok: var(--neu-ok);
    --color-err: var(--neu-err);
    --font-sans: "Quicksand", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Composants réutilisables (modifie ici pour changer le style partout) ---------- */
  @layer components {
    .card      { @apply mb-6 rounded-3xl bg-base p-5; box-shadow: var(--neu-out); }
    .card[data-state=locked] { @apply opacity-60; }
    .inset     { @apply rounded-2xl; box-shadow: var(--neu-in); }

    .btn       { @apply mt-3 w-full cursor-pointer select-none rounded-2xl bg-base px-4 py-3 text-sm font-semibold text-accent transition; box-shadow: var(--neu-out-sm); }
    .btn:hover:not(:disabled)  { color: var(--neu-accent-dark); }
    .btn:active:not(:disabled) { box-shadow: var(--neu-in-sm); }
    .btn:disabled { @apply cursor-not-allowed opacity-40; box-shadow: none; }
    .btn-primary { background: var(--neu-grad); color: var(--neu-on-accent); }
    .btn-primary:hover:not(:disabled) { background: var(--neu-accent-dark); color: var(--neu-on-accent); }

    .field     { @apply w-full rounded-xl bg-base px-3 py-2.5 text-sm text-ink outline-none placeholder:text-mute/70; box-shadow: var(--neu-in-sm); }
    .field:focus { box-shadow: var(--neu-in-sm), 0 0 0 2px var(--neu-accent); }
    textarea.field { @apply min-h-56 font-mono text-xs; }
    .lbl       { @apply mb-1 mt-3 block text-xs font-medium text-mute; }
    .muted     { @apply text-xs leading-relaxed text-mute; }
    .log       { @apply mt-3 whitespace-pre-wrap break-words text-xs; }
    .check     { @apply mt-3 flex items-center gap-2 text-sm text-ink; }
    .check input { @apply size-4 accent-[var(--neu-accent)]; }

    /* gros bouton "choisir un fichier" bien visible */
    .drop      { @apply flex cursor-pointer flex-col items-center justify-center gap-1 rounded-2xl bg-base px-4 py-6 text-center text-sm font-semibold text-accent transition; box-shadow: var(--neu-out-sm); }
    .drop small { @apply text-xs font-normal text-mute; }
    .drop:hover, .drop.over { box-shadow: var(--neu-in-sm); }
    input:focus-visible + .drop { outline: 2px solid var(--neu-accent); outline-offset: 2px; }

    /* étapes */
    .step-dot  { @apply inline-flex size-8 shrink-0 items-center justify-center rounded-full bg-base text-sm font-bold text-mute; box-shadow: var(--neu-out-sm); }
    .step-dot[data-state=done]    { background: var(--neu-grad); color: var(--neu-on-accent); }
    .step-dot[data-state=current] { color: var(--neu-accent); box-shadow: var(--neu-in-sm), 0 0 0 2px var(--neu-accent); }
    .step[data-state=current] .step-label { @apply font-semibold text-ink; }
    .status-dot { @apply inline-block size-2.5 rounded-full bg-mute/60; }
    .status-dot.on { background: var(--neu-ok); }

    /* miniatures */
    .thumb     { @apply relative; }
    .thumb img { @apply block aspect-square w-full rounded-xl object-cover; box-shadow: var(--neu-out-sm); }
    .thumb .n  { @apply absolute left-1.5 top-1.5 rounded-full bg-black/65 px-1.5 text-[11px] text-white; }
    .thumb .x, .thumb .c { @apply absolute m-0 flex size-6 cursor-pointer items-center justify-center rounded-full border-0 bg-black/65 p-0 text-xs text-white; }
    .thumb .x  { @apply right-1.5 top-1.5; }
    .thumb .c  { @apply bottom-1.5 right-1.5; }

    /* aperçu */
    .preview   { @apply flex flex-col overflow-hidden p-0; }
    .pv-scroll { @apply flex-1 overflow-auto p-5; }
    .pv-bar    { @apply p-5 pt-1; }
    .pv-title  { @apply mb-1 mt-4 text-xl font-bold; }
    .pv-step h3 { @apply mb-1.5 mt-5 text-sm font-semibold text-accent; }
    .pv-step ul { @apply mb-2 list-disc pl-5 text-sm; }
    .pv-step p { @apply m-0 whitespace-pre-wrap text-sm leading-relaxed; }
    .chip      { @apply mr-1 mt-1 inline-block rounded-full bg-base px-3 py-0.5 text-xs; box-shadow: var(--neu-out-sm); }
    .pv-empty  { @apply rounded-2xl p-8 text-center text-sm text-mute; box-shadow: var(--neu-in); }

    /* tableau nutrition */
    .nt        { @apply mt-2 w-full border-collapse text-xs; }
    .nt th, .nt td { @apply border-b border-mute/20 px-1.5 py-1 text-right; }
    .nt th:first-child, .nt td:first-child { @apply text-left; }
    .nt tr.tot td { @apply font-bold; }

    /* recadrage */
    .ratios button.on { background: var(--neu-grad); color: var(--neu-on-accent); }
  }

  /* poignées de recadrage (hors composants : sélecteurs d'attributs) */
  #cropRect { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; touch-action: none; }
  #cropRect i { position: absolute; width: 26px; height: 26px; background: #fff; border: 2px solid var(--neu-accent); border-radius: 50%; touch-action: none; }
  #cropRect i[data-h=nw] { left: -13px; top: -13px; cursor: nwse-resize; }
  #cropRect i[data-h=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
  #cropRect i[data-h=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; }
  #cropRect i[data-h=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }
  .crop-stage img { display: block; max-width: min(85vw, 700px); max-height: 55vh; }
  [hidden] { display: none !important; }

  /* ---------- Mobile : une étape par écran ---------- */
  @media (max-width: 1023px) {
    .mob-off { display: none !important; }
    .field, textarea.field { font-size: 16px; }   /* évite le zoom automatique d'iOS */
  }
</style>
</head>

<body class="bg-base font-sans text-ink antialiased" style="padding-top: env(safe-area-inset-top, 0px)">
<div class="mx-auto max-w-[1240px] px-4 pb-32 pt-6 lg:pb-16">

  <h1 class="mb-3 text-2xl font-bold tracking-tight">Import Tandoor</h1>

  <ol id="stepper" class="sticky top-0 z-30 -mx-4 mb-3 grid grid-cols-5 gap-2 bg-base px-4 py-2 lg:static lg:mx-0 lg:px-0">
    <li class="step flex cursor-pointer flex-col items-center gap-1 text-center text-xs text-mute sm:flex-row sm:text-left" data-step="1" onclick="goStep(1)"><span class="step-dot" data-badge="1">1</span><span class="step-label">Connexion</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1 text-center text-xs text-mute sm:flex-row sm:text-left" data-step="2" onclick="goStep(2)"><span class="step-dot" data-badge="2">2</span><span class="step-label">Source</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1 text-center text-xs text-mute sm:flex-row sm:text-left" data-step="3" onclick="goStep(3)"><span class="step-dot" data-badge="3">3</span><span class="step-label">Ajuster</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1 text-center text-xs text-mute sm:flex-row sm:text-left" data-step="4" onclick="goStep(4)"><span class="step-dot" data-badge="4">4</span><span class="step-label">Image</span></li>
    <li class="step flex cursor-pointer flex-col items-center gap-1 text-center text-xs text-mute sm:flex-row sm:text-left" data-step="5" onclick="goStep(5)"><span class="step-dot" data-badge="5">5</span><span class="step-label">Envoi</span></li>
  </ol>
  <p id="nextHint" class="inset mb-6 px-4 py-2.5 text-sm"></p>

  <div class="grid grid-cols-1 gap-x-6 lg:grid-cols-2 lg:items-start">

    <!-- ============ Gauche : les étapes ============ -->
    <div>

      <!-- 1 · Connexion -->
      <section class="card" data-card="1">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="1">1</span>
          <h2 class="flex items-center gap-2 font-semibold">Connexion <span id="statusDot" class="status-dot"></span></h2>
        </header>
        <label class="lbl" for="tandoorUrl">Adresse Tandoor</label>
        <input class="field" type="text" id="tandoorUrl" placeholder="https://cook.cabanologues.com" oninput="updateUI()">
        <label class="lbl" for="tandoorToken">Token Tandoor</label>
        <input class="field" type="password" id="tandoorToken" placeholder="tda_…" oninput="updateUI()">
        <label class="lbl" for="anthropicKey">Clé API Claude</label>
        <input class="field" type="password" id="anthropicKey" placeholder="sk-ant-…">
        <label class="lbl" for="claudeModel">Modèle</label>
        <input class="field" type="text" id="claudeModel" placeholder="claude-sonnet-5">
        <button class="btn btn-primary" onclick="saveAuth()">Enregistrer</button>
        <p class="muted mt-3" id="authInfo"></p>
      </section>

      <!-- 2 · Source -->
      <section class="card" data-card="2">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="2">2</span>
          <h2 class="font-semibold">Source</h2>
        </header>

        <input id="photoFiles" class="sr-only" type="file" accept="image/*" multiple onchange="addPhotos(this)">
        <label for="photoFiles" class="drop" id="dropZone">
          <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Ajouter des photos</span>
          <small>ou les glisser ici</small>
        </label>
        <div class="mt-3 grid grid-cols-[repeat(auto-fill,minmax(84px,1fr))] gap-3" id="thumbs"></div>

        <label class="lbl" for="postText">Texte d'un post (Instagram, Facebook…)</label>
        <textarea class="field !min-h-28" id="postText" oninput="updateUI()" placeholder="Description et commentaires du reel"></textarea>
        <label class="lbl" for="postUrl">Lien du post</label>
        <input class="field" type="text" id="postUrl" inputmode="url" placeholder="Facultatif, gardé comme source" oninput="updateUI()">

        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-primary" onclick="analyzePhotos()" id="analyzeBtn">Analyser</button>
          <button class="btn" onclick="clearPhotos()" id="clearBtn">Effacer</button>
        </div>
        <p class="muted mt-2 text-err" id="analyzeWhy"></p>
        <div class="log" id="photoLog"></div>

        <details class="mt-4">
          <summary class="cursor-pointer text-xs font-medium text-accent">Modifier le JSON</summary>
          <textarea class="field mt-3" id="recipeJson" oninput="renderPreview()" spellcheck="false" placeholder="{ … }"></textarea>
          <button class="btn" onclick="loadExample()">Charger un exemple</button>
        </details>
        <button class="btn lg:hidden" onclick="goStep(5)">Voir l'aperçu</button>
      </section>

      <!-- 3 · Ajuster -->
      <section class="card" data-card="3">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="3">3</span>
          <h2 class="font-semibold">Ajuster <span class="text-xs font-normal text-mute">facultatif</span></h2>
        </header>

        <label class="lbl" for="modText">Modification</label>
        <input class="field" type="text" id="modText" placeholder="Ex. remplacer le poulet par du tofu" oninput="updateUI()" onkeydown="if(event.key==='Enter') modifyRecipe()">
        <div class="grid grid-cols-2 gap-3">
          <button class="btn btn-primary" onclick="modifyRecipe()" id="modBtn">Appliquer</button>
          <button class="btn" onclick="undoModify()" id="undoBtn">Annuler</button>
        </div>
        <p class="muted mt-2 text-err" id="modWhy"></p>
        <div class="log" id="modLog"></div>

        <h3 class="mb-1 mt-6 text-sm font-semibold">Nutrition <span class="text-xs font-normal text-mute">estimation</span></h3>
        <div id="nutriBox"></div>
        <label class="check"><input type="checkbox" id="nutriSave" checked> Inclure à l'envoi</label>
        <button class="btn" onclick="calcNutrition()" id="nutriBtn">Recalculer</button>
        <p class="muted mt-2 text-err" id="nutriWhy"></p>
        <div class="log" id="nutriLog"></div>
        <button class="btn lg:hidden" onclick="goStep(5)">Voir l'aperçu</button>
      </section>

      <!-- 4 · Image -->
      <section class="card" data-card="4">
        <header class="mb-4 flex items-center gap-3">
          <span class="step-dot" data-badge="4">4</span>
          <h2 class="font-semibold">Image</h2>
        </header>

        <div class="lg:hidden">
          <img id="pvImg2" class="mb-2 block max-h-64 w-full rounded-2xl object-cover" style="box-shadow: var(--neu-out-sm)" alt="" hidden>
          <p class="muted mb-3" id="candLabel2"></p>
        </div>

        <input id="imageFile" class="sr-only" type="file" accept="image/*" onchange="pickOwnImage(this)">
        <label for="imageFile" class="drop">
          <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
          <span>Choisir une image</span>
        </label>

        <div class="grid grid-cols-3 gap-3">
          <button class="btn" onclick="nextCandidate()" id="nextImgBtn">Autre</button>
          <button class="btn" onclick="cropCurrent()" id="cropBtn">Recadrer</button>
          <button class="btn" onclick="restoreOriginal()" id="origBtn">Original</button>
        </div>
        <div class="log" id="imageLog"></div>

        <details class="mt-4">
          <summary class="cursor-pointer text-xs font-medium text-accent">Ajouter à une recette existante</summary>
          <button class="btn" onclick="loadRecipes()">Mes recettes</button>
          <select id="recipePick" hidden onchange="document.getElementById('recipeId').value = this.value" class="field mt-3"></select>
          <label class="lbl" for="recipeId">ID</label>
          <input class="field" type="text" id="recipeId" placeholder="Vide : recette du JSON">
          <button class="btn" onclick="uploadImage()" id="sendImgBtn">Envoyer l'image</button>
          <div class="log" id="existLog"></div>
        </details>
      </section>
    </div>

    <!-- ============ Droite : aperçu et envoi ============ -->
    <div class="lg:self-stretch">
      <section class="card preview lg:sticky lg:top-4 lg:max-h-[calc(100vh-2rem)]" data-card="5">
        <div class="pv-scroll">
          <header class="mb-4 flex items-center gap-3">
            <span class="step-dot" data-badge="5">5</span>
            <h2 class="font-semibold">Aperçu</h2>
          </header>
          <img id="pvImg" class="block max-h-80 w-full rounded-2xl object-cover" style="box-shadow: var(--neu-out-sm)" alt="" hidden>
          <div class="pv-empty" id="pvNoImg">Pas d'image</div>
          <p class="muted mt-2" id="candLabel"></p>
          <div id="pvBody"></div>
        </div>
        <div class="pv-bar">
          <div class="muted" id="pvChecklist"></div>
          <button class="btn btn-primary" onclick="importRecipe()" id="sendBtn">Envoyer à Tandoor</button>
          <p class="muted mt-2 text-err" id="sendWhy"></p>
          <div class="log" id="importLog"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- Navigation mobile -->
<nav class="fixed inset-x-3 bottom-3 z-40 grid grid-cols-[1fr_auto_1fr] items-center gap-2 rounded-3xl bg-base p-2 lg:hidden" style="box-shadow: var(--neu-out); padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px))">
  <button class="btn mt-0" id="mobPrev" onclick="goStep(mobStep - 1)">Retour</button>
  <span id="mobLabel" class="px-1 text-center text-xs font-medium text-mute"></span>
  <button class="btn btn-primary mt-0" id="mobNext" onclick="goStep(mobStep + 1)">Suivant</button>
</nav>

<!-- Recadrage -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/65 p-4" id="cropModal" hidden>
  <div class="max-h-full w-full max-w-[760px] overflow-auto rounded-3xl bg-base p-5" style="box-shadow: var(--neu-out)">
    <h2 class="mb-3 font-semibold">Recadrer</h2>
    <div class="crop-stage relative mx-auto w-fit touch-none select-none overflow-hidden bg-black" id="cropStage">
      <img id="cropImg" alt="">
      <div id="cropRect"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div>
    </div>
    <div class="ratios grid grid-cols-4 gap-3" id="cropRatios">
      <button class="btn on" data-r="free" onclick="setRatio('free')">Libre</button>
      <button class="btn" data-r="1" onclick="setRatio('1')">1:1</button>
      <button class="btn" data-r="1.3333" onclick="setRatio('1.3333')">4:3</button>
      <button class="btn" data-r="1.7778" onclick="setRatio('1.7778')">16:9</button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <button class="btn btn-primary" onclick="applyCrop()">Valider</button>
      <button class="btn" onclick="closeCrop()">Annuler</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function log(el, msg, cls) {
  const d = document.getElementById(el);
  const line = document.createElement('div');
  if (cls === 'ok') line.className = 'text-ok';
  else if (cls === 'err') line.className = 'text-err';
  line.textContent = msg;
  d.prepend(line);
}

// ---------- État de l'interface : étapes, boutons verrouillés ----------
const busy = { analyze: false, mod: false, nutri: false, send: false };

// ---------- Mobile : une étape (= un écran) à la fois ----------
let mobStep = 1, lastCur = 1;
const STEP_NAMES = ['Connexion', 'Source', 'Ajuster', 'Image', 'Envoi'];
const isDesktop = () => matchMedia('(min-width: 1024px)').matches;

function goStep(n) {
  mobStep = Math.max(1, Math.min(5, n));
  document.querySelectorAll('[data-card]').forEach(c => c.classList.toggle('mob-off', Number(c.dataset.card) !== mobStep));
  $('mobLabel').textContent = 'Étape ' + mobStep + '/5 · ' + STEP_NAMES[mobStep - 1];
  $('mobPrev').disabled = mobStep === 1;
  $('mobNext').disabled = mobStep === 5;
  if (isDesktop()) document.querySelector('[data-card="' + mobStep + '"]').scrollIntoView({ behavior: 'smooth', block: 'start' });
  else window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('resize', () => { if (isDesktop()) document.querySelectorAll('.mob-off').forEach(c => c.classList.remove('mob-off')); else goStep(mobStep); });

function uiState() {
  const { url, token } = getAuth();
  let p = null;
  try { p = JSON.parse($('recipeJson').value); } catch (e) {}
  return {
    connected: !!(url && token),
    key: !!localStorage.getItem('anthropic_key'),
    hasRecipe: !!(p && p.name && Array.isArray(p.steps) && p.steps.length),
    hasImage: !!current,
    hasPhotos: photos.length > 0,
    hasText: !!$('postText').value.trim(),
    hasMod: !!$('modText').value.trim(),
    fresh: !!(nutri && nutriFor === $('recipeJson').value),
    sentThis: !!(sent && sent.json === $('recipeJson').value)
  };
}

function gate(id, ok, why, whyId) {
  $(id).disabled = !ok;
  if (whyId) $(whyId).textContent = ok ? '' : why;
}

function updateUI() {
  const s = uiState();
  const noKey = 'Clé Claude manquante (étape 1).';
  const noRecipe = 'Pas encore de recette.';

  gate('analyzeBtn', s.key && (s.hasPhotos || s.hasText) && !busy.analyze,
    !s.key ? noKey : 'Ajoute une photo ou un texte.', 'analyzeWhy');
  $('clearBtn').disabled = !(s.hasPhotos || s.hasText || $('postUrl').value.trim());

  gate('modBtn', s.key && s.hasRecipe && s.hasMod && !busy.mod,
    !s.hasRecipe ? noRecipe : !s.key ? noKey : 'Décris la modification.', 'modWhy');
  $('undoBtn').disabled = !undoStack.length;

  gate('nutriBtn', s.key && s.hasRecipe && !busy.nutri,
    !s.hasRecipe ? noRecipe : noKey, 'nutriWhy');

  $('nextImgBtn').disabled = !queue.length;
  $('cropBtn').disabled = !s.hasImage;
  $('origBtn').disabled = !s.hasImage;
  $('sendImgBtn').disabled = !s.hasImage || !s.connected;

  gate('sendBtn', s.connected && s.hasRecipe && !busy.send,
    !s.connected ? 'Connexion manquante (étape 1).' : 'Pas encore de recette.', 'sendWhy');

  // progression : 1 connexion, 2 recette, 3 ajuster (facultatif), 4 image, 5 envoi
  const done = { 1: s.connected, 2: s.hasRecipe, 3: s.fresh || undoStack.length > 0, 4: s.hasImage, 5: s.sentThis };
  const cur = [1, 2, 4, 5].find(n => !done[n]) || 5;
  lastCur = cur;
  document.querySelectorAll('[data-badge]').forEach(b => {
    const n = Number(b.dataset.badge);
    const state = done[n] ? 'done' : n === cur ? 'current' : 'todo';
    b.dataset.state = state;
    b.textContent = state === 'done' ? '✓' : n;
  });
  document.querySelectorAll('#stepper .step').forEach(li => {
    const n = Number(li.dataset.step);
    li.dataset.state = done[n] ? 'done' : n === cur ? 'current' : 'todo';
  });
  document.querySelector('[data-card="3"]').dataset.state = s.hasRecipe ? '' : 'locked';

  let hint;
  if (s.sentThis) hint = 'Recette envoyée (ID ' + sent.id + ').';
  else if (!s.connected) hint = 'Commence par enregistrer ta connexion.';
  else if (!s.hasRecipe) hint = (s.hasPhotos || s.hasText)
    ? 'Lance l\'analyse.'
    : 'Ajoute des photos ou colle le texte d\'un post.';
  else if (!s.hasImage) hint = 'Choisis une image, ou envoie sans.';
  else hint = 'Prêt : vérifie l\'aperçu, puis envoie.';
  $('nextHint').textContent = hint;
}

function resizeToJpeg(file, maxSide = 2000) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('conversion impossible')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(src); reject(new Error('image illisible (' + file.name + ')')); };
    img.src = src;
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

async function addPhotos(input) {
  for (const f of input.files) {
    try {
      const blob = await resizeToJpeg(f);
      photos.push({ name: f.name, blob, b64: await blobToBase64(blob) });
    } catch (e) {
      log('photoLog', '' + e.message, 'err');
    }
  }
  input.value = '';

async function callClaude(system, content, tool) {
  const key = localStorage.getItem('anthropic_key') || '';
  if (!key) throw new Error('clé API Anthropic manquante (section « Connexion »)');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json'
    },
    body: JSON.stringify({
      model: localStorage.getItem('claude_model') || DEFAULT_MODEL,
      max_tokens: 8000,
      system,
      tools: [tool],
      tool_choice: { type: 'tool', name: tool.name },
      messages: [{ role: 'user', content }]
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('API ' + res.status + ' — ' + ((data.error && data.error.message) || JSON.stringify(data)));
  const use = (data.content || []).find(b => b.type === 'tool_use');
  if (!use) throw new Error('réponse inattendue de Claude');
  return use.input;
}

const NUTRI_PROMPT = `Tu estimes les apports nutritionnels d'une recette. Pour CHAQUE ingrédient listé (fusionne les doublons), donne les valeurs pour la QUANTITÉ TOTALE utilisée dans la recette, pas pour 100 g, d'après les tables de composition usuelles (CIQUAL / USDA).
- Tiens compte de l'état de l'ingrédient (en conserve égoutté, cru/cuit, etc.) et convertis les mesures en grammes de façon raisonnable.
- Ingrédients sans quantité (« au goût », « pincée », garniture non chiffrée) : compte-les à ~0 et signale-le dans « assumptions ».
- Ne compte que ce qui est dans la liste d'ingrédients ; ne suppose pas d'ajouts.
Réponds uniquement via l'outil submit_nutrition.`;

let nutri = null;    // { total, perPortion, servings, rows, assumptions }
let nutriFor = '';   // valeur du JSON pour laquelle le calcul a été fait

const r1 = n => Math.round((Number(n) || 0) * 10) / 10;
const sumKey = (rows, k) => rows.reduce((a, r) => a + (Number(r[k]) || 0), 0);

async function calcNutrition() {
  const src = document.getElementById('recipeJson').value;
  let p;
  try { p = JSON.parse(src); } catch (e) { log('nutriLog', 'JSON invalide : ' + e.message, 'err'); return; }
  if (!localStorage.getItem('anthropic_key')) { log('nutriLog', 'Clé API Anthropic requise pour le calcul.', 'err'); return; }
  busy.nutri = true; updateUI();
  log('nutriLog', 'Calcul en cours…');
  try {
    const r = fromTandoorPayload(p);
    const list = r.steps.flatMap(s => s.ingredients);
    const out = await callClaude(NUTRI_PROMPT, [{
      type: 'text',
      text: 'Recette « ' + r.name + ' » — ' + (r.servings || 1) + ' ' + (r.servings_text || 'portion(s)') + '.\nIngrédients :\n' + JSON.stringify(list)
    }], NUTRI_TOOL);
    const rows = out.ingredients || [];
    const servings = Number(p.servings) > 0 ? Number(p.servings) : 1;
    const keys = ['calories', 'proteins', 'carbohydrates', 'sugars', 'fibers', 'fats', 'saturated_fats'];
    const total = {}, perPortion = {};
    keys.forEach(k => { total[k] = r1(sumKey(rows, k)); perPortion[k] = r1(sumKey(rows, k) / servings); });
    nutri = { total, perPortion, servings, rows, assumptions: out.assumptions || '' };
    nutriFor = src;
    renderNutrition();
    log('nutriLog', perPortion.calories + ' kcal par portion.', 'ok');
  } catch (e) {
    log('nutriLog', 'Échec : ' + e.message, 'err');
  } finally {
    busy.nutri = false; updateUI();
  }
}

function renderNutrition() {
  const box = document.getElementById('nutriBox');
  box.textContent = '';
  renderPreview();
  if (!nutri) return;
  const t = document.createElement('table');
  t.className = 'nt';
  const addRow = (cells, cls, tag = 'td') => {
    const tr = document.createElement('tr');
    if (cls) tr.className = cls;
    cells.forEach(c => { const td = document.createElement(tag); td.textContent = c; tr.append(td); });
    t.append(tr);
  };
  addRow(['Ingrédient', 'kcal', 'Prot. g', 'Gluc. g', 'Lip. g'], '', 'th');
  nutri.rows.forEach(r => addRow([r.food + (r.quantity ? ' (' + r.quantity + ')' : ''), r1(r.calories), r1(r.proteins), r1(r.carbohydrates), r1(r.fats)]));
  const tt = nutri.total, pp = nutri.perPortion;
  addRow(['Total recette', tt.calories, tt.proteins, tt.carbohydrates, tt.fats], 'tot');
  addRow(['Par portion (÷ ' + nutri.servings + ')', pp.calories, pp.proteins, pp.carbohydrates, pp.fats], 'tot');
  box.append(t);
  const extra = document.createElement('p');
  extra.className = 'muted';
  extra.textContent = 'Par portion — dont sucres ' + pp.sugars + ' g · fibres ' + pp.fibers + ' g · graisses saturées ' + pp.saturated_fats + ' g.'
    + (nutri.assumptions ? ' Hypothèses : ' + nutri.assumptions : '');
  box.append(extra);
}

function renderPreview() {
  const body = document.getElementById('pvBody');
  const chk = document.getElementById('pvChecklist');
  const src = document.getElementById('recipeJson').value;
  body.textContent = '';
  if (!src.trim()) {
    body.append(el('div', 'pv-empty mt-4', 'Rien à afficher pour l\'instant.'));
    chk.textContent = '';
    updateUI();
    return;
  }
  let p;
  try {
    p = JSON.parse(src);
    if (!p || typeof p !== 'object') throw new Error('objet attendu');
  } catch (e) {
    body.append(el('p', 'mt-4 text-xs text-err', 'JSON invalide : ' + e.message));
    chk.textContent = 'JSON invalide.';
    updateUI();
    return;
  }
  body.append(el('h3', 'pv-title', p.name || '(sans nom)'));
  if (p.description) body.append(el('p', 'muted', p.description));
  const meta = [];
  if (p.servings) meta.push(p.servings + ' ' + (p.servings_text || 'portion(s)'));
  if (p.working_time) meta.push(p.working_time + ' min');
  if (p.waiting_time) meta.push('+ ' + p.waiting_time + ' min d\'attente');
  if (meta.length) body.append(el('p', 'muted', meta.join(' · ')));
  if (p.source_url) body.append(el('p', 'muted break-all', 'Source : ' + p.source_url));
  const kw = el('div');
  (p.keywords || []).forEach(k => kw.append(el('span', 'chip', k.name || k)));
  body.append(kw);

  const nutriFresh = nutri && nutriFor === src;
  if (nutri) {
    const pp = nutri.perPortion;
    body.append(el('p', 'muted', nutriFresh
      ? 'Par portion : ' + pp.calories + ' kcal · ' + pp.proteins + ' g prot. · ' + pp.carbohydrates + ' g gluc. · ' + pp.fats + ' g lip.'
      : 'Nutrition à recalculer.'));
  }

  let nIng = 0;
  (p.steps || []).forEach((s, i) => {
    const d = el('div', 'pv-step');
    d.append(el('h3', '', s.name || 'Étape ' + (i + 1)));
    const ul = el('ul');
    (s.ingredients || []).forEach(g => {
      nIng++;
      const txt = [fmtAmount(g.amount), g.unit && g.unit.name, g.food && g.food.name].filter(Boolean).join(' ')
        + (g.note ? ' — ' + g.note : '');
      ul.append(el('li', '', txt));
    });
    if (ul.children.length) d.append(ul);
    d.append(el('p', '', s.instruction || ''));
    body.append(d);
  });

  const parts = ['Recette ✓'];
  parts.push(current ? 'Image ✓' : 'Image –');
  parts.push(nutriFresh && document.getElementById('nutriSave').checked ? 'Nutrition ✓' : 'Nutrition –');
  chk.textContent = parts.join('    ');
  updateUI();
}

function setCurrent(blob, label, orig) {

  if (currentUrl) URL.revokeObjectURL(currentUrl);

  img.src = currentUrl;
  img.hidden = false;
  document.getElementById('pvNoImg').hidden = true;
  document.getElementById('candLabel').textContent = label;
  const img2 = document.getElementById('pvImg2');
  img2.src = currentUrl;
  img2.hidden = false;

}

async function pickOwnImage(input) {

const baseLabel = l => l.replace(/ \(recadrée\)$/, '');

function cropCurrent() {
  if (!current) { alert('Aucune image à recadrer.'); return; }
  const orig = current.orig, label = baseLabel(current.label) + ' (recadrée)';
  openCrop(orig, b => setCurrent(b, label, orig));
}

function restoreOriginal() {
  if (!current) return;
  setCurrent(current.orig, baseLabel(current.label), current.orig);
}

// ---------- Recadrage ----------
let cropState = null;
const clamp =(v, a, b) => Math.max(a, Math.min(b, v));
const CROP_MIN = 30;

function openCrop(blob, onDone) {
  const img = $('cropImg');
  cropState = { url: URL.createObjectURL(blob), onDone, ratio: null, r: null, W: 0, H: 0, drag: null };
  $('cropModal').hidden = false;
  img.onload = () => {
    cropState.W = img.clientWidth;
    cropState.H = img.clientHeight;
    setRatio('free', true);
  };
  img.src = cropState.url;
}

function closeCrop() {
  if (cropState) URL.revokeObjectURL(cropState.url);
  cropState = null;
  $('cropModal').hidden = true;
}

function setRatio(key, init) {
  const s = cropState;
  if (!s) return;
  s.ratio = key === 'free' ? null : Number(key);
  document.querySelectorAll('#cropRatios button').forEach(b => b.classList.toggle('on', b.dataset.r === key));
  if (key === 'free' && !init && s.r) { drawCrop(); return; }
  let w = s.W * 0.9, h = s.H * 0.9;
  if (s.ratio) { if (w / h > s.ratio) w = h * s.ratio; else h = w / s.ratio; }
  s.r = { x: (s.W - w) / 2, y: (s.H - h) / 2, w, h };
  drawCrop();
}

function drawCrop() {
  const r = cropState.r, e = $('cropRect');
  e.style.left = r.x + 'px'; e.style.top = r.y + 'px';
  e.style.width = r.w + 'px'; e.style.height = r.h + 'px';
}

$('cropRect').addEventListener('pointerdown', e => {
  const s = cropState;
  if (!s) return;
  s.drag = { mode: e.target.dataset.h || 'move', sx: e.clientX, sy: e.clientY, r0: { ...s.r } };
  e.currentTarget.setPointerCapture(e.pointerId);
  e.preventDefault();
});

$('cropRect').addEventListener('pointermove', e => {
  const s = cropState;
  if (!s || !s.drag) return;
  const d = s.drag, r0 = d.r0;
  if (d.mode === 'move') {
    s.r.x = clamp(r0.x + e.clientX - d.sx, 0, s.W - r0.w);
    s.r.y = clamp(r0.y + e.clientY - d.sy, 0, s.H - r0.h);
  } else {
    const st = $('cropStage').getBoundingClientRect();
    const px = clamp(e.clientX - st.left, 0, s.W), py = clamp(e.clientY - st.top, 0, s.H);
    const left = d.mode.includes('w'), top = d.mode.includes('n');
    const fx = left ? r0.x + r0.w : r0.x, fy = top ? r0.y + r0.h : r0.y;
    const maxW = left ? fx : s.W - fx, maxH = top ? fy : s.H - fy;
    let w = clamp(left ? fx - px : px - fx, CROP_MIN, maxW);
    let h = clamp(top ? fy - py : py - fy, CROP_MIN, maxH);
    if (s.ratio) {
      if (w / h > s.ratio) w = h * s.ratio; else h = w / s.ratio;
      if (w > maxW) { w = maxW; h = w / s.ratio; }
      if (h > maxH) { h = maxH; w = h * s.ratio; }
    }
    s.r = { x: left ? fx - w : fx, y: top ? fy - h : fy, w, h };
  }
  drawCrop();
});

['pointerup', 'pointercancel'].forEach(ev => $('cropRect').addEventListener(ev, () => { if (cropState) cropState.drag = null; }));

window.addEventListener('resize', () => {
  const s = cropState, img = $('cropImg');
  if (!s || $('cropModal').hidden || !s.W || !img.clientWidth) return;
  const k = img.clientWidth / s.W;
  s.r = { x: s.r.x * k, y: s.r.y * k, w: s.r.w * k, h: s.r.h * k };
  s.W = img.clientWidth; s.H = img.clientHeight;
  drawCrop();
});

function applyCrop() {
  const s = cropState, img = $('cropImg');
  if (!s) return;
  const k = img.naturalWidth / s.W;
  const sx = s.r.x * k, sy = s.r.y * k, sw = s.r.w * k, sh = s.r.h * k;
  const scale = Math.min(1, 2000 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const onDone = s.onDone;
  c.toBlob(b => {
    closeCrop();
    if (b) onDone(b); else alert('Recadrage impossible.');
  }, 'image/jpeg', 0.9);
}

// ---------- Image de la recette ----------
async function wikimediaCandidates(q) {
  const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8'
    + '&gsrsearch=' + encodeURIComponent(q + ' filetype:bitmap')
    + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=1200';
  const d = await (await fetch(u)).json();
  const pages = Object.values((d.query && d.query.pages) || {}).sort((a, b) => a.index - b.index);
  return pages
    .filter(p => p.imageinfo && p.imageinfo[0].mime === 'image/jpeg')
    .map(p => ({
      kind: 'wikimedia',
      url: p.imageinfo[0].thumburl || p.imageinfo[0].url,
      label: 'Wikimedia Commons — ' + p.title.replace(/^File:/, '') + ' (vérifie la licence : ' + p.imageinfo[0].descriptionurl + ')'
    }));
}

async function prepareImageQueue(r) {
  queue = [];
  const i = r.dish_photo_index;
  if (Number.isInteger(i) && photos[i]) {
    queue.push({ kind: 'photo', blob: photos[i].blob, label: 'Ta photo n°' + (i + 1) + ' (plat fini)' });
  }
  try {
    (await wikimediaCandidates(r.image_search_query || r.name)).forEach(c => queue.push(c));
  } catch (e) {
    log('imageLog', 'Recherche Wikimedia impossible : ' + e.message, 'err');
  }
  queue.push({ kind: 'ai', prompt: r.image_prompt || ('appetizing photo of ' + r.name), seed: 1 });
}

async function loadCandidate(c) {
  if (c.blob) return c.blob;
  const src = c.kind === 'ai'
    ? 'https://image.pollinations.ai/prompt/' + encodeURIComponent(c.prompt) + '?width=1024&height=768&nologo=true&seed=' + c.seed
    : c.url;
  const res = await fetch(src);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const blob = await res.blob();
  if (!blob.type.startsWith('image/')) throw new Error('réponse non image');
  return blob;
}

async function nextCandidate() {
  while (queue.length) {
    const c = queue.shift();
    if (c.kind === 'ai') log('imageLog', 'Génération de l\'image…');
    try {
      const blob = await loadCandidate(c);
      if (c.kind === 'ai') queue.push({ ...c, seed: c.seed + 1 });
      setCurrent(blob, c.kind === 'ai' ? 'Image générée par IA (Pollinations) — variante ' + c.seed : c.label);
      return true;
    } catch (e) {
      log('imageLog', 'Proposition ignorée (' + c.kind + ') : ' + e.message, 'err');
    }
  }
  updateUI();
  log('imageLog', 'Plus de proposition disponible. Choisis ton propre fichier.', 'err');
  return false;
}

// Distingue « serveur injoignable » de « bloqué par CORS ».
async function netHint(url) {
  try {
    await fetch(url + '/api/', { mode: 'no-cors' });
    return ' — le serveur répond, donc la requête est bloquée par CORS : autorise ' + location.origin + ' côté Tandoor / reverse proxy (Access-Control-Allow-Origin, Allow-Headers: authorization, et réponse aux requêtes OPTIONS).';
  } catch (e) {
    return ' — ' + url + ' est injoignable depuis ce navigateur (hors de ton réseau local ? port 443 non redirigé, certificat invalide, ou URL http bloquée depuis une page https).';
  }
}

async function apiGet(url, token, path) {
  const r = await fetch(url + path, { headers: { 'Authorization': 'Bearer ' + token } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('erreur ' + r.status);
  return d;
}

// Recette du JSON (par nom exact), sinon la plus récente.
async function findRecipe(url, token) {
  let name = '';
  try { name = JSON.parse(document.getElementById('recipeJson').value).name || ''; } catch (e) {}
  if (name) {
    const d = await apiGet(url, token, '/api/recipe/?page_size=20&query=' + encodeURIComponent(name));
    const hits = (d.results || []).filter(r => r.name === name).sort((a, b) => b.id - a.id);
    if (hits.length) return hits[0];
  }
  const d = await apiGet(url, token, '/api/recipe/?page_size=50&sort_order=-created_at');
  const all = (d.results || []).sort((a, b) => b.id - a.id);
  if (!all.length) throw new Error('aucune recette trouvée');
  return all[0];
}

async function loadRecipes() {
  const { url, token } = getAuth();
  if (!url || !token) { alert('Connecte-toi d\'abord.'); return; }
  try {
    const d = await apiGet(url, token, '/api/recipe/?page_size=50&sort_order=-created_at');
    const sel = document.getElementById('recipePick');
    sel.textContent = '';
    sel.append(new Option('— choisir une recette —', ''));
    (d.results || []).sort((a, b) => b.id - a.id).forEach(r => sel.append(new Option(r.name + ' (#' + r.id + ')', r.id)));
    sel.hidden = false;
  } catch (e) {
    log('existLog', 'Chargement des recettes impossible : ' + e.message + await netHint(url), 'err');
  }
}

async function importRecipe() {
  const { url, token } = getAuth();
  if (!url || !token) { alert('Connecte-toi d\'abord.'); return; }
  let payload;
  try {
    payload = JSON.parse(document.getElementById('recipeJson').value);
  } catch (e) {
    log('importLog', 'JSON invalide : ' + e.message, 'err');
    return;
  }
  if (sent && sent.json === document.getElementById('recipeJson').value
      && !confirm('Cette recette a déjà été envoyée (ID ' + sent.id + '). Envoyer à nouveau créera un doublon. Continuer ?')) return;
  if (nutri && document.getElementById('nutriSave').checked) {
    if (nutriFor === document.getElementById('recipeJson').value) {
      const p = nutri.perPortion;
      payload.nutrition = { calories: p.calories, proteins: p.proteins, carbohydrates: p.carbohydrates, fats: p.fats, source: 'Estimation Claude' };
      const line = 'Par portion (estimation) : ' + p.calories + ' kcal · ' + p.proteins + ' g protéines · ' + p.carbohydrates + ' g glucides · ' + p.fats + ' g lipides.';
      const d = payload.description ? payload.description + '\n' + line : line;
      if (d.length <= 512) payload.description = d;
    } else {
      log('importLog', 'Nutrition non incluse : recalcule-la (la recette a changé).');
    }
  }
  busy.send = true; updateUI();
  try {
    const res = await fetch(url + '/api/recipe/', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json; charset=utf-8'
      },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      log('importLog', 'Recette créée (ID ' + data.id + ').', 'ok');
      document.getElementById('recipeId').value = data.id;
      sent = { id: data.id, json: document.getElementById('recipeJson').value };
      if (current) await uploadImage(data.id, 'importLog');
      else log('importLog', 'Envoyée sans image.');
    } else {
      log('importLog', 'Erreur ' + res.status + ' — ' + JSON.stringify(data), 'err');
    }
  } catch (e) {
    log('importLog', 'Échec réseau : ' + e.message + await netHint(url), 'err');
  } finally {
    busy.send = false; updateUI();
  }
}

async function uploadImage(knownId, logEl = 'existLog') {
  const { url, token } = getAuth();
  let id = knownId ? String(knownId) : document.getElementById('recipeId').value.trim();
  const blob = current && current.blob;
  if (!url || !token) { alert('Connecte-toi d\'abord.'); return false; }
  if (!blob) { alert('Aucune image : lance l\'analyse des photos ou choisis un fichier.'); return false; }
  if (!id) {
    // Pas d'ID : on cherche la recette par le nom du JSON, sinon la plus récente.
    try {
      const r = await findRecipe(url, token);
      id = String(r.id);
      document.getElementById('recipeId').value = id;
      log(logEl, 'ID non renseigné → recette trouvée : ' + r.name + ' (ID ' + id + ')');
    } catch (e) {
      log(logEl, 'Impossible de trouver la recette : ' + e.message + await netHint(url), 'err');
      return false;
    }
  }
  const form = new FormData();
  form.append('image', blob, 'recette.jpg');
  try {
    const res = await fetch(url + '/api/recipe/' + id + '/image/', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token },
      body: form
    });
    if (res.ok) {
      log(logEl, 'Image envoyée (recette ' + id + ').', 'ok');
      return true;
    }
    const t = await res.text();
    log(logEl, 'Erreur ' + res.status + ' — ' + t.slice(0, 200), 'err');
  } catch (e) {
    log(logEl, 'Échec réseau : ' + e.message + await netHint(url), 'err');
  }
  return false;
}
