<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
	:root {
		--bg: #ebe6f2;
		--sh-dark: #c9c1d6;
		--sh-light: #ffffff;
		--ink: #4a4060;
		--muted: #8c82a3;
		--faint: #d8d1e3;
		--accent: #e07a9f;
		--accent-2: #9b87e0;
		--link: #7b62d1;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #2b2735;
			--sh-dark: #1d1a24;
			--sh-light: #39344a;
			--ink: #ece6f7;
			--muted: #a79dbf;
			--faint: #3a3448;
			--accent: #f29ab9;
			--accent-2: #b9a8f2;
			--link: #c4b3ff;
		}
	}
	:root[data-theme="dark"] {
		--bg: #2b2735;
		--sh-dark: #1d1a24;
		--sh-light: #39344a;
		--ink: #ece6f7;
		--muted: #a79dbf;
		--faint: #3a3448;
		--accent: #f29ab9;
		--accent-2: #b9a8f2;
		--link: #c4b3ff;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		background: var(--bg);
		color: var(--ink);
		font: 16px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	main { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
	.raised { background: var(--bg); border-radius: 28px; box-shadow: 9px 9px 18px var(--sh-dark), -9px -9px 18px var(--sh-light); }
	.inset { background: var(--bg); box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light); }

	header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 26px; }
	h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
	.chips { display: flex; flex-wrap: wrap; gap: 10px; }
	.chip { border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
	.chip b { color: var(--ink); }

	.types { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; width: fit-content; max-width: 100%; margin: 0 auto 22px; }
	.types button {
		font: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
		background: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
		box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
		transition: box-shadow .15s, color .15s;
	}
	.types button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light); }
	.types button:focus-visible, .dot:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }

	.chart { padding: 18px 12px 10px; }
	svg { display: block; width: 100%; height: auto; overflow: visible; }
	.tick { fill: var(--muted); font-size: 12px; }
	.grid { stroke: var(--faint); stroke-width: 1; }
	.groove { fill: none; stroke: var(--sh-dark); stroke-width: 9; stroke-linecap: round; opacity: .45; }
	.curve { fill: none; stroke: url(#grad); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
	.dot { cursor: pointer; outline: none; }
	.dot circle { fill: var(--bg); filter: url(#neu); transition: stroke .15s; }
	.dot.on circle { stroke: var(--accent); stroke-width: 2.5; }
	.dot text { font-size: 13px; pointer-events: none; }

	.detail { margin-top: 26px; padding: 22px 24px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: start; }
	.detail .emo { grid-row: span 4; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; }
	.detail .when { color: var(--muted); font-size: 14px; }
	.detail .what { font-size: 1.2rem; font-weight: 800; line-height: 1.3; }
	.detail .epoch { color: var(--accent); font-weight: 700; }
	.detail .event { margin-top: 8px; padding: 12px 16px; border-radius: 18px; grid-column: 2; }
	.detail .event a, .detail .event .ev-name { color: var(--link); font-weight: 700; text-decoration: none; }
	.detail .event a:hover { text-decoration: underline; }
	.detail .event p { margin: 4px 0 0; font-size: 14px; }
	.detail .event .ago { color: var(--muted); font-size: 13px; }

	@media (max-width: 600px) {
		main { padding: 22px 14px 36px; }
		h1 { font-size: 1.3rem; }
		.chart { padding: 12px 4px 6px; }
		.types button { padding: 7px 12px; font-size: 13px; }
		.detail { padding: 18px; grid-template-columns: 1fr; }
		.detail .emo { grid-row: auto; width: 52px; height: 52px; font-size: 24px; }
		.detail .event { grid-column: 1; }
	}
</style>

<main>
	<header>
		<h1>Big Bang en deux mois 🌌</h1>
		<div class="chips">
			<span class="chip inset"><b id="count"></b> moments</span>
			<span class="chip inset">mis à jour le <b id="updated"></b></span>
		</div>
	</header>

	<div class="types raised" id="types" role="group" aria-label="Type de courbe"></div>

	<div class="chart raised">
		<svg id="chart" role="img" aria-label="Courbe : mes dates projetées sur l'histoire de l'Univers">
			<defs>
				<filter id="neu" x="-60%" y="-60%" width="220%" height="220%">
					<feDropShadow dx="2.5" dy="2.5" stdDeviation="2" style="flood-color: var(--sh-dark)"/>
					<feDropShadow dx="-2.5" dy="-2.5" stdDeviation="2" style="flood-color: var(--sh-light)"/>
				</filter>
				<linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
					<stop offset="0" style="stop-color: var(--accent-2)"/>
					<stop offset="1" style="stop-color: var(--accent)"/>
				</linearGradient>
			</defs>
		</svg>
	</div>

	<section class="detail raised" id="detail" aria-live="polite"></section>
</main>

		{ d: "2025-12-21", n: "Le solstice d'hiver", p: "La nuit la plus longue de l'année.", w: "Solstice de décembre" },

		{ d: "2026-02-17", n: "Le Nouvel An chinois", p: "Entrée dans l'année du Cheval de feu.", w: "Nouvel An chinois" },
		{ d: "2026-03-20", n: "L'équinoxe de printemps", p: "Le printemps commence officiellement.", w: "Équinoxe de mars" },

		{ d: "2026-07-14", n: "Le 14 Juillet", p: "Feux d'artifice et bals des pompiers.", w: "Fête nationale française" },
		{ d: "2026-07-19", n: "Finale de la Coupe du monde 2026", p: "La première Coupe du monde à 48 équipes se termine au MetLife Stadium.", w: "Coupe du monde de football 2026" },
		{ d: "2026-07-26", n: "Arrivée du Tour à Paris", p: "Le maillot jaune sur les Champs-Élysées.", w: "Tour de France 2026" },
		{ d: "2026-08-12", n: "Éclipse totale sur l'Espagne", p: "La première éclipse totale visible en Europe continentale depuis 1999, la nuit des Perséides.", w: "Éclipse solaire du 12 août 2026" },
		{ d: "2026-08-28", n: "Éclipse partielle de Lune", p: "La Lune presque entièrement dans l'ombre de la Terre.", w: "Éclipse lunaire du 28 août 2026" },
		{ d: "2026-09-01", n: "La rentrée des classes", p: "Cartables neufs et odeur de colle.", w: "Rentrée scolaire" },
		{ d: "2026-09-11", n: "Roch Hachana", p: "Le Nouvel An juif, avec pommes et miel.", w: "Roch Hachana" },
		{ d: "2026-09-19", n: "Les Journées du patrimoine", p: "Les lieux d'habitude fermés ouvrent leurs portes.", w: "Journées européennes du patrimoine" },
		{ d: "2026-09-23", n: "L'équinoxe d'automne", p: "Jour et nuit à égalité.", w: "Équinoxe de septembre" },
		{ d: "2026-09-25", n: "La fête de la Mi-Automne", p: "Gâteaux de lune et lanternes sous la pleine lune.", w: "Fête de la mi-automne" },
		{ d: "2026-09-29", n: "La Saint-Michel", p: "Fête de l'archange ; autrefois, le jour des loyers et des foires.", w: "Saint-Michel (fête)" },
		{ d: "2026-09-30", n: "La Journée mondiale de la traduction", p: "À la Saint-Jérôme, patron des traducteurs.", w: "Journée mondiale de la traduction" },
	].map((e) => ({
		days: e.ya ? e.ya * YEAR : e.d ? (END - Date.parse(e.d + "T00:00:00Z")) / DAY : (END_YEAR - e.y) * YEAR,
		name: e.n, note: e.p, url: wiki(e.w),
	}));

	// ───── Calcul ─────
	const fracT = (m) => (m.t - START) / DAY / SPAN;
	const lookback = (t) => Math.pow(10, LOGMAX + (LOGMIN - LOGMAX) * TYPES[type].f(Math.min(Math.max(t, 0), 1)));
	const uOf = (days) => (LOGMAX - Math.log10(days)) / (LOGMAX - LOGMIN);

	function nearest(days, self) {
		// Mes propres dates servent aussi de repères (pour les dernières semaines).
		const mine = MOMENTS.filter((m, i) => i !== self && m.t < END).map((m) => ({
			days: (END - m.t) / DAY, name: m.name, note: `${m.emo} Un de tes propres moments : la courbe se mord la queue.`, url: null,
		}));
		let best = null;
		for (const e of EVENTS.concat(mine)) {
			if (e.days <= 0) continue;
			const dist = Math.abs(Math.log10(e.days) - Math.log10(days));
			if (!best || dist < best.dist) best = { ...e, dist };
		}
		return best;
	}

	const num = (n, d = 0) => n.toLocaleString("fr-FR", { maximumFractionDigits: d });
	const dateFr = (t, month = "long") => {
		const d = new Date(t);
		const day = d.getUTCDate();
		return `${day === 1 ? "1er" : day} ${d.toLocaleDateString("fr-FR", { month, timeZone: "UTC" })}`;
	};
	function describe(days) {
		const years = days / YEAR;
		if (years >= 1e9) return `il y a ${num(years / 1e9, 2)} milliards d'années`;
		if (years >= 1e6) return `il y a ${num(years / 1e6, 1)} million${years >= 2e6 ? "s" : ""} d'années`;
		if (years >= 10000) return `il y a ${num(Math.round(years / 100) * 100)} ans`;
		if (years >= 100) {
			const y = Math.floor(END_YEAR - years);
			return `il y a ${num(years)} ans · ${y <= 0 ? `vers ${num(1 - y)} av. J.-C.` : `vers ${y}`}`;
		}
		const whole = Math.max(1, Math.round(days));
		const t = END - (years >= 1 ? days : whole) * DAY;
		const full = `${dateFr(t)} ${new Date(t).getUTCFullYear()}`;
		if (years >= 1) return `il y a ${num(years, 1)} ans · ${full}`;
		return `il y a ${whole} jour${whole >= 2 ? "s" : ""} · ${full}`;
	}

	// ───── En-tête & boutons ─────
	document.getElementById("count").textContent = MOMENTS.length;
	document.getElementById("updated").textContent = `${dateFr(END)} ${new Date(END).getUTCFullYear()}`;
	const typesEl = document.getElementById("types");
	for (const [k, v] of Object.entries(TYPES)) {
		const b = document.createElement("button");
		b.type = "button"; b.textContent = v.label; b.dataset.k = k;
		b.addEventListener("click", () => { type = k; try { localStorage.setItem("bb-type", k); } catch (e) {} render(); });
		typesEl.appendChild(b);
	}

	// ───── Dessin ─────
	const svg = document.getElementById("chart");
	const NS = "http://www.w3.org/2000/svg";
	const el = (name, attrs, parent = svg) => {
		const e = document.createElementNS(NS, name);
		for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
		parent.appendChild(e);
		return e;
	};

	function render() {
		for (const b of typesEl.children) b.setAttribute("aria-pressed", b.dataset.k === type);
		[...svg.children].forEach((c) => c.tagName !== "defs" && c.remove());

		const narrow = svg.parentElement.clientWidth < 560;
		const W = narrow ? 360 : 900, H = narrow ? 460 : 470;
		const M = narrow ? { l: 74, r: 16, t: 18, b: 34 } : { l: 104, r: 26, t: 22, b: 36 };
		const iw = W - M.l - M.r, ih = H - M.t - M.b;
		svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
		const x = (t) => M.l + t * iw;
		const y = (days) => M.t + (1 - uOf(days)) * ih;
		const r = narrow ? 11 : 14;

		for (const [d, label] of [[LMAX, "Big Bang"], [1e9 * YEAR, "1 Md ans"], [1e6 * YEAR, "1 M ans"], [1e3 * YEAR, "1 000 ans"], [YEAR, "1 an"], [1, "1 jour"]]) {
			el("line", { class: "grid", x1: M.l, x2: W - M.r, y1: y(d), y2: y(d) });
			el("text", { class: "tick", x: M.l - r - 6, y: y(d) + 4, "text-anchor": "end" }).textContent = label;
		}
		const mid = Date.UTC(new Date(START).getUTCFullYear(), new Date(START).getUTCMonth() + 1, 1);
		for (const [t, a] of [[START, "start"], [mid, "middle"], [END, "end"]]) {
			if (t > END) continue;
			el("text", { class: "tick", x: x((t - START) / DAY / SPAN), y: H - 8, "text-anchor": a }).textContent = dateFr(t, "short");
		}

		let d = "";
		for (let i = 0; i <= 300; i++) {
			const t = i / 300;
			d += `${i ? "L" : "M"}${x(t).toFixed(1)},${y(lookback(t)).toFixed(1)}`;
		}
		el("path", { class: "groove", d });
		el("path", { class: "curve", d });

		MOMENTS.forEach((m, i) => {
			const t = fracT(m);
			const g = el("g", { class: "dot" + (i === selected ? " on" : ""), tabindex: 0, role: "button", "aria-label": `${dateFr(m.t)} : ${m.name}` });
			el("circle", { cx: x(t), cy: y(lookback(t)), r }, g);
			el("text", { x: x(t), y: y(lookback(t)) + (narrow ? 4.5 : 5), "text-anchor": "middle", style: `font-size:${narrow ? 11 : 14}px` }, g).textContent = m.emo;
			const pick = () => { selected = i; render(); };
			g.addEventListener("click", pick);
			g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
		});
		// Le point choisi passe devant les autres.
		const on = svg.querySelector(".dot.on"); if (on) svg.appendChild(on);

		showDetail();
	}

	function gap(d) {
		const y = d / YEAR;
		if (y >= 1e6) return `${num(y / 1e6, 1)} M ans`;
		if (y >= 2) return `${num(y)} ans`;
		if (y >= 1) return "1 an";
		const j = Math.round(d);
		return j < 1 ? "moins d'un jour" : `${j} jour${j >= 2 ? "s" : ""}`;
	}

	function showDetail() {
		const m = MOMENTS[selected];
		const days = lookback(fracT(m));
		const e = nearest(days, selected);
		const evName = e.url ? `<a href="${e.url}" target="_blank" rel="noopener">${e.name}</a>` : `<span class="ev-name">${e.name}</span>`;
		document.getElementById("detail").innerHTML =
			`<div class="emo inset">${m.emo}</div>` +
			`<div class="when">${dateFr(m.t)} ${new Date(m.t).getUTCFullYear()}</div>` +
			`<div class="what">${m.name}</div>` +
			`<div class="epoch">↦ ${describe(days)}</div>` +
			`<div class="event inset">${evName}<p>${e.note}</p><p class="ago">${describe(e.days)} · écart : ${gap(Math.abs(e.days - days))}</p></div>`;
	}

	render();
	let lastNarrow = null;
	addEventListener("resize", () => {
		const n = svg.parentElement.clientWidth < 560;
		if (n !== lastNarrow) { lastNarrow = n; render(); }
	});
	lastNarrow = svg.parentElement.clientWidth < 560;
})();
</script>
